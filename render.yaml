# BE — ambiente `test` en Render (07 §26, §31 Q-008 Render-first, §36).
# Solo datos sintéticos (08 §33). Ningún dato real hasta cerrar G-Q008-1, G-Q008-2 y el gate 08 §42.
# Este Blueprint NO es la única definición del runtime (07 §61): la API se define por apps/api/Dockerfile
# y el procedimiento completo está en docs/DESPLIEGUE.md.

databases:
  - name: be-db-test
    region: frankfurt
    # Plan pago desde el 2026-10-16 (Dirección): el gratuito vencía el 2026-10-18, antes de la entrega. Una base paga no
    # vence; pasar de gratuita a paga conserva los datos. Basic-256mb es la instancia mínima (07 §31).
    plan: basic-256mb
    postgresMajorVersion: "16" # alineado con el harness postgres:16-alpine (07 §21, §35)
    databaseName: be_test
    user: be_test
    ipAllowList: [] # sin acceso externo: solo red privada de Render (07 §29)

services:
  - type: web
    name: be-api
    runtime: docker
    region: frankfurt
    # Starter desde el 2026-10-16 (Dirección): la gratuita se apagaba a los 15 minutos sin tráfico y tardaba ~30 s en volver.
    plan: starter
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready # readiness gate del deploy (07 §30, §36)
    autoDeployTrigger: checksPass # test ← auto-deploy "After CI Checks Pass" (07 §36)
    buildFilter:
      paths:
        - apps/api/**
        - packages/domain/**
        - prisma/**
        - package.json
        - package-lock.json
    envVars:
      - key: APP_ENV
        value: test
      - key: DATABASE_URL
        fromDatabase:
          name: be-db-test
          property: connectionString
      # Firma de sesión (WP-02, 07 §27/§28): Render genera el valor y nunca se versiona.
      # Rotarlo invalida todas las sesiones (08 §26.3, 07:1051).
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://be-web-1ngj.onrender.com # allowlist del ambiente test (07 §27): origen del website; no es secreto
      # WP-03 (DEUDA_LEGAJO DL-036): cuentas profesionales demo que el servicio interno verifica y habilita al arrancar.
      # Solo con APP_ENV test. Van por identidad ya registrada, no por correo: nadie puede anticiparse registrando el
      # correo publicado, y la siembra solo prepara cuentas sintéticas (@example.invalid). No es un secreto.
      #
      # WP-05 suma la capacidad antropométrica, que el 06 modela como transversal y «nunca tercera Especialidad»
      # (06:2774). Por eso se declara de dos formas, y las dos son válidas:
      # - sobre DEMO-PN, que ya tiene la Especialidad Nutrición: la capacidad se agrega, no la reemplaza ni la duplica;
      # - sobre DEMO-PA, que no tiene ninguna Especialidad: «cero Especialidades, Capacidad antropométrica verificada y
      #   Habilitación antropométrica efectiva» es una identidad válida (06 §8.10).
      # El tipo de perfil (SANITARIO / NO_SANITARIO) es de la identidad, no del alcance: la segunda declaración de una
      # misma identidad no lo cambia.
      # Desde el 2026-10-16, también los profesionales de la cohorte realista (pedido de Dirección: personas con nombre y
      # años de historia): Lic. Sofía Paz (Nutrición y Antropometría), Prof. Martín Acosta (Entrenamiento) y Prof. Lucía
      # Benítez (Antropometría). Cuentas sintéticas @example.invalid, como las demás; sus credenciales viven fuera del repo.
      - key: BE_DEMO_PROFESIONALES
        value: "9172fae6-13b8-4d34-8139-711b89d460c4|NUTRICION|SANITARIO|Lic. Demo Nutrición;81e11918-19f7-4f56-ac5c-1420a3da77bb|ENTRENAMIENTO|NO_SANITARIO|Prof. Demo Entrenamiento;9172fae6-13b8-4d34-8139-711b89d460c4|ANTROPOMETRIA|SANITARIO|Lic. Demo Nutrición;c837438d-b72f-413c-a433-9ab9ae010e4c|ANTROPOMETRIA|NO_SANITARIO|Prof. Demo Antropometría;240099e8-c7c0-4f8c-b45e-d6bbe00b774c|NUTRICION|SANITARIO|Lic. Sofía Paz;240099e8-c7c0-4f8c-b45e-d6bbe00b774c|ANTROPOMETRIA|SANITARIO|Lic. Sofía Paz;1c936397-98bc-4869-92ef-f723df9c7f59|ENTRENAMIENTO|NO_SANITARIO|Prof. Martín Acosta;f589af26-3dfe-483d-a112-a608ddc38d3d|ANTROPOMETRIA|NO_SANITARIO|Prof. Lucía Benítez"
      # DL-125 (precierre del 2026-10-06, §6): el acto EVIDENCIA_VISUAL del 08 §12.4. Con "true", subir la foto de una
      # comida exige haber registrado la información destacada para el profesional de Nutrición, y ese profesional ve las
      # fotos solo con el acto vigente. El texto es una PROPUESTA, pendiente de aprobación de Dirección y de validación
      # jurídica: pasar a "true" es una decisión de Dirección, aun con cuentas sintéticas.
      - key: BE_EVIDENCIA_VISUAL_EXIGIDA
        value: "false"
      # DL-133 (WP-NOVEDADES-Y-AVISOS): los avisos push salen por Expo Push, después de confirmar el hecho y lo mejor
      # posible (07 §23); si Expo no responde, la novedad queda igual en el centro (RF-061). Para que un teléfono Android
      # los reciba, el proyecto de Expo necesita la clave FCM V1 de Firebase (docs/DESPLIEGUE.md, «Avisos push»).
      # EXPO_ACCESS_TOKEN es opcional: solo si se activa la seguridad reforzada de los avisos en Expo (se carga a mano).
      - key: BE_AVISOS_PUSH
        value: expo
      # El secreto con que la tarea programada be-recordatorios llama a la corrida interna. Lo genera Render.
      - key: BE_SECRETO_DE_TAREAS
        generateValue: true

  # DL-133 (WP-NOVEDADES-Y-AVISOS) y DL-137 (la agenda de entrenamiento): los recordatorios diarios. 07 §24: «un cron
  # administrado de la plataforma llamando un endpoint interno idempotente». Render programa en UTC: 13:00, 18:00 y 01:00
  # son las 10:00, las 15:00 y las 22:00 de Argentina. Solo llama a la API con el secreto de be-api (scripts/disparar-recordatorios.mjs, sin dependencias); la
  # API decide la franja por su hora y repetirla no duplica nada. Starter: se cobra por minuto de ejecución, con un mínimo
  # de un dólar por mes.
  - type: cron
    name: be-recordatorios
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: "0 1,13,18 * * *"
    autoDeployTrigger: checksPass
    buildCommand: node --version
    startCommand: node scripts/disparar-recordatorios.mjs
    buildFilter:
      paths:
        - scripts/disparar-recordatorios.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BE_API_URL
        value: https://be-api-hndp.onrender.com
      - key: BE_SECRETO_DE_TAREAS
        fromService:
          type: web
          name: be-api
          envVarKey: BE_SECRETO_DE_TAREAS

  - type: web
    name: be-web
    runtime: static
    branch: main
    # El website compila contra los contratos de @be/domain (09v7 T21): se construye primero el dominio.
    buildCommand: npm ci -w @be/web -w @be/domain --include-workspace-root && npm run build -w @be/domain && npm run build -w @be/web
    staticPublishPath: ./apps/web/out
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - packages/domain/**
        - package.json
        - package-lock.json
    envVars:
      # Sitio estático: Render elige Node por NODE_VERSION (prioridad sobre .nvmrc y engines).
      # "22" = última 22.x disponible en Render; cumple engines (>=22.12.0 <23). Sin esto, los
      # servicios creados desde 2026-09-17 usan el default 24.21.0 y npm ci falla con EBADENGINE.
      - key: NODE_VERSION
        value: "22"
      # DL-030 (decisión de Dirección, 2026-09-19): el website llama a la API directo, con CORS, para que la API vea
      # la IP real (08 §12.2, evidencia de A1/A2). Se inyecta en el build; no es secreto. Si cambia la URL de la API,
      # cambiar también connect-src de la CSP y API_BASE_URL de apps/mobile/eas.json.
      - key: BE_API_BASE_URL
        value: https://be-api-hndp.onrender.com
      # DL-138 (WP-ACCESO-GOOGLE): «Continuar con Google» aparece solo si el build tiene BE_GOOGLE_WEB_CLIENT_ID, el client
      # ID «Aplicación web» de Google. No está acá: se carga a mano en be-web → Environment, con «Save, rebuild, and
      # deploy» (no es un secreto; docs/DESPLIEGUE.md, «Entrar con Google»). Sin ella, el website queda como siempre.
    # Sin rewrite /api/* (DL-030, decisión de Dirección del 2026-09-19): el website llama a la API directo, con CORS
    # (07 CAND-07-J opción B), para que la API vea la IP real (08 §12.2). Detrás del rewrite veía un pool de IPs del
    # proxy. El Blueprint conserva las reglas de ruteo que se omiten del archivo: la regla vieja se borra también en el
    # dashboard (be-web → Redirects/Rewrites), y DESPLIEGUE verifica en negativo que /api/* ya no llega a la API.
    # 07 §29: HSTS/CSP en el web.
    # DL-138 (WP-ACCESO-GOOGLE): Google Identity Services, el botón «Continuar con Google», necesita dos cosas, y nada más:
    # - en la CSP, su script (script-src …/gsi/client), su hoja de estilos (style-src …/gsi/style), el marco donde dibuja
    #   el botón (frame-src …/gsi/) y sus pedidos (connect-src …/gsi/). Todo bajo https://accounts.google.com/gsi/, como lo
    #   indica Google; ningún otro origen. La cuenta se elige en una ventana de Google, fuera de la página.
    # - el Referrer-Policy en strict-origin-when-cross-origin, el que recomienda Google, en lugar de no-referrer: Google
    #   valida el client ID contra el origen del website que lee del Referer, y sin él rechaza todo («The given origin is
    #   not allowed for the given client ID»). Hacia otros sitios viaja solo el origen (https://be-web-1ngj.onrender.com/),
    #   nunca la ruta ni la consulta, y nada si la página es https y el destino no. El token de una invitación va en el
    #   fragmento, que no viaja nunca. Es también lo que hace el navegador cuando el sitio no dice nada.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; font-src 'self'; connect-src 'self' https://be-api-hndp.onrender.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
