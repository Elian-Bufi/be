# BE — ambiente `test` en Render (07 §26, §31 Q-008 Render-first, §36).
# Solo datos sintéticos (08 §33). Ningún dato real hasta cerrar G-Q008-1, G-Q008-2 y el gate 08 §42.
# Este Blueprint NO es la única definición del runtime (07 §61): la API se define por apps/api/Dockerfile
# y el procedimiento completo está en docs/DESPLIEGUE.md.

databases:
  - name: be-db-test
    region: frankfurt
    plan: free # expira a los 30 días (07 §31; ver DECISIONES_TECNICAS.md)
    postgresMajorVersion: "16" # alineado con el harness postgres:16-alpine (07 §21, §35)
    databaseName: be_test
    user: be_test
    ipAllowList: [] # sin acceso externo: solo red privada de Render (07 §29)

services:
  - type: web
    name: be-api
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready # readiness gate del deploy (07 §30, §36)
    autoDeployTrigger: checksPass # test ← auto-deploy "After CI Checks Pass" (07 §36)
    buildFilter:
      paths:
        - apps/api/**
        - packages/domain/**
        - prisma/**
        - package.json
        - package-lock.json
    envVars:
      - key: APP_ENV
        value: test
      - key: DATABASE_URL
        fromDatabase:
          name: be-db-test
          property: connectionString
      # Firma de sesión (WP-02, 07 §27/§28): Render genera el valor y nunca se versiona.
      # Rotarlo invalida todas las sesiones (08 §26.3, 07:1051).
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://be-web-1ngj.onrender.com # allowlist del ambiente test (07 §27): origen del website; no es secreto

  - type: web
    name: be-web
    runtime: static
    branch: main
    # El website compila contra los contratos de @be/domain (09v7 T21): se construye primero el dominio.
    buildCommand: npm ci -w @be/web -w @be/domain --include-workspace-root && npm run build -w @be/domain && npm run build -w @be/web
    staticPublishPath: ./apps/web/out
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/web/**
        - packages/domain/**
        - package.json
        - package-lock.json
    envVars:
      # Sitio estático: Render elige Node por NODE_VERSION (prioridad sobre .nvmrc y engines).
      # "22" = última 22.x disponible en Render; cumple engines (>=22.12.0 <23). Sin esto, los
      # servicios creados desde 2026-09-17 usan el default 24.21.0 y npm ci falla con EBADENGINE.
      - key: NODE_VERSION
        value: "22"
    # 07 CAND-07-J opción C: same-origin, el borde rutea /api/* a la API.
    # Destino = la API (be-api-hndp), no el website: no depende de la URL del sitio estático.
    # Los subdominios onrender.com son globales: el nombre real lo asigna Render.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://be-api-hndp.onrender.com/api/*
    # 07 §29: HSTS/CSP en el web.
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
