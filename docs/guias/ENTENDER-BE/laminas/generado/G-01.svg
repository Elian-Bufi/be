<rect x="4" y="8" width="136" height="88" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="72" y="35.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Nivel 1 · El sentido</text>
<text x="72" y="50.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">¿Qué problema resuelve</text>
<text x="72" y="63.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">BE y qué valor está</text>
<text x="72" y="75.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">demostrado?</text>
<rect x="155.5" y="8" width="136" height="88" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="223.5" y="28.85" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Nivel 2 · Las piezas</text>
<text x="223.5" y="43.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">APK, website, API,</text>
<text x="223.5" y="56.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">dominio compartido y</text>
<text x="223.5" y="69.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">base: qué hace cada</text>
<text x="223.5" y="82.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">una.</text>
<rect x="307" y="8" width="136" height="88" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="375" y="35.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Nivel 3 · Las reglas</text>
<text x="375" y="50.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Dónde se valida, dónde</text>
<text x="375" y="63.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">se decide el acceso y</text>
<text x="375" y="75.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">qué garantiza la base.</text>
<rect x="458.5" y="8" width="136" height="88" rx="10" fill="#DCE8FC" stroke="#0A1F44" stroke-width="2"/>
<text x="526.5" y="35.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Nivel 4 · Dos recorridos</text>
<text x="526.5" y="50.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Una comida y una</text>
<text x="526.5" y="63.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">suspensión, de la</text>
<text x="526.5" y="75.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">pantalla a los datos.</text>
<rect x="610" y="8" width="136" height="88" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="678" y="35.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Nivel 5 · El cambio</text>
<text x="678" y="50.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Migraciones, versiones,</text>
<text x="678" y="63.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">pruebas, CI y</text>
<text x="678" y="75.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">despliegue.</text>
<rect x="287" y="132" width="176" height="74.48" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="375" y="151.66" font-family="Inter" font-size="11" font-weight="600" fill="#0A1F44" text-anchor="middle">Cuaderno de datos</text>
<text x="375" y="164.77" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">[PDF aparte]</text>
<text x="375" y="181.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">La base de datos por áreas, de</text>
<text x="375" y="194.37" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">macro a micro.</text>
<rect x="610" y="132" width="136" height="74.48" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="678" y="151.66" font-family="Inter" font-size="11" font-weight="600" fill="#0A1F44" text-anchor="middle">Plan de estudio</text>
<text x="678" y="164.77" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">[cuatro sesiones]</text>
<text x="678" y="181.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">Ejercicios, con las</text>
<text x="678" y="194.37" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">respuestas aparte.</text>
