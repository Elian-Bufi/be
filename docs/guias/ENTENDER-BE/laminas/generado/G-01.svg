<text x="13" y="148.69" font-family="Inter" font-size="10" font-weight="600" fill="#0A1F44">Cómo leerla</text>
<text x="13" y="161.49" font-family="Inter" font-size="10" font-weight="400" fill="#566881">Cada lámina responde una pregunta. Las tarjetas de</text>
<text x="13" y="174.29" font-family="Inter" font-size="10" font-weight="400" fill="#566881">concepto dan el término técnico, la explicación en</text>
<text x="13" y="187.09" font-family="Inter" font-size="10" font-weight="400" fill="#566881">criollo, un ejemplo de BE y una pregunta para</text>
<text x="13" y="199.89" font-family="Inter" font-size="10" font-weight="400" fill="#566881">comprobar.</text>
