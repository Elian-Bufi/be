<rect x="4" y="4" width="150" height="74" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="79" y="24.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Un pedido protegido</text>
<text x="79" y="39.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Por ejemplo, API-PRJ-01</text>
<text x="79" y="52.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">con la sesión del</text>
<text x="79" y="64.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">profesional.</text>
<rect x="182" y="4" width="150" height="74" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="257" y="30.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">PdpGuard</text>
<text x="257" y="45.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Antes del controlador: pide</text>
<text x="257" y="58.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">la decisión al PDP.</text>
<rect x="360" y="4" width="186" height="74" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="453" y="30.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Bloquea lo que corta</text>
<text x="453" y="45.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Toma, en modo compartido, las</text>
<text x="453" y="58.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">filas que podrían cortar el acceso.</text>
<rect x="574" y="4" width="172" height="74" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="660" y="24.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Lee los hechos</text>
<text x="660" y="39.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Una sola consulta y sin caché:</text>
<text x="660" y="52.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">cuentas, verificación, vínculo,</text>
<text x="660" y="64.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">autorización.</text>
<rect x="12" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="61" y="141.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Rol</text>
<text x="61" y="156.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Profesional, y</text>
<text x="61" y="169.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">sobre otra</text>
<text x="61" y="181.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">persona.</text>
<rect x="116.67" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="165.67" y="147.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Especialidad</text>
<text x="165.67" y="162.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Verificado en</text>
<text x="165.67" y="175.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">esa área.</text>
<rect x="221.33" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="270.33" y="128.45" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Situación</text>
<text x="270.33" y="143.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Cuentas</text>
<text x="270.33" y="156.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">operativas, no</text>
<text x="270.33" y="169.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">suspendido,</text>
<text x="270.33" y="181.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">habilitado, A3</text>
<text x="270.33" y="194.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">vigente.</text>
<rect x="326" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="375" y="128.45" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Vínculo</text>
<text x="375" y="143.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Alcance</text>
<text x="375" y="156.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">ACEPTADO:</text>
<text x="375" y="169.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">pausado o</text>
<text x="375" y="181.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">finalizado</text>
<text x="375" y="194.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">cortan.</text>
<rect x="430.67" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="479.67" y="141.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Consentimiento</text>
<text x="479.67" y="156.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Autorización</text>
<text x="479.67" y="169.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">VIGENTE, con</text>
<text x="479.67" y="181.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">versión.</text>
<rect x="535.33" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="584.33" y="134.85" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Finalidad</text>
<text x="584.33" y="149.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">La misma en la</text>
<text x="584.33" y="162.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">operación, el</text>
<text x="584.33" y="175.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">vínculo y la</text>
<text x="584.33" y="188.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">autorización.</text>
<rect x="640" y="114" width="98" height="88" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="689" y="147.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Alcance</text>
<text x="689" y="162.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">El área pedida es</text>
<text x="689" y="175.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">la del vínculo.</text>
<path d="M 375 221 L 390 236 L 375 251 L 360 236 Z" fill="#FFFFFF" stroke="#0A1F44" stroke-width="1.3"/>
<rect x="4" y="214" width="300" height="76" rx="10" fill="#E7F9FD" stroke="#0E7490" stroke-width="1.2"/>
<text x="154" y="241.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Permitida: las siete favorables</text>
<text x="154" y="256.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">La decisión se guarda en la misma transacción, con la</text>
<text x="154" y="269.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">autorización y su versión, y la operación sigue.</text>
<rect x="446" y="214" width="300" height="76" rx="10" fill="#FFF7ED" stroke="#B45309" stroke-width="1.2" stroke-dasharray="1.4 2.4"/>
<text x="596" y="235.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Denegada: alguna desfavorable</text>
<text x="596" y="250.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">La decisión se guarda aparte, con las dimensiones que</text>
<text x="596" y="263.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">fallaron; la operación se revierte y responde 404</text>
<text x="596" y="275.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">RESOURCE_NOT_FOUND.</text>
