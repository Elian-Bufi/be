<svg xmlns="http://www.w3.org/2000/svg" width="750pt" height="294pt" viewBox="0 0 750 294" data-lamina="G-07">
<title>El PDP: siete dimensiones, una decisión guardada</title>
<desc>Cada operación sobre datos de una persona pasa por el mismo punto de decisión, que no confía en nada que diga el cliente. · Fuente: apps/api/src/autorizacion · packages/domain/src/autorizacion.ts · Versión: e4512cb (2026-10-26) · Estado: implementado</desc>
