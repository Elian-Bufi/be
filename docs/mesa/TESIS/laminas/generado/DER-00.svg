<text x="590" y="363.89" font-family="Inter" font-size="10" font-weight="400" fill="#566881">entre sí; el número dice</text>
<text x="590" y="376.69" font-family="Inter" font-size="10" font-weight="400" fill="#566881">cuántas. Las 71 claves hacia</text>
