t="400" text-anchor="start" fill="#53657D">Línea continua: asociación/composición conceptual. Discontinua: referencia o dependencia. PK/FK: claves y referencias conceptuales, no SQL.</text><text x="45" y="841" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">* Inferencia justificada en DV-06_RELACIONES.csv; extremo sin número: no fijado por la fuente. No convertirlo en una restricción por defecto.</text><text x="45" y="859" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">R028 refiere Versión de Objetivo. R029–032: jerarquía de Versión de plan emitida. R033 solo modalidad A; R034 según contexto.</text><text x="45" y="877" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 / H-07-DOM-01). No autoriza DDL ni elimina historia.</text></svg>