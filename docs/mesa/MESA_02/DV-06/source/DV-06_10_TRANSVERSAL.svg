Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..N</text><rect x="1195.7" y="540.6" width="50" height="18" rx="3" fill="white"/><text x="1220.7" y="553.6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R058 *</text><text x="1143.2" y="517.4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><text x="1280.2" y="516.6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..N</text><rect x="30" y="804" width="2144" height="82" rx="7" fill="#F4F7FB"/><text x="45" y="823" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">Línea continua: asociación/composición conceptual. Discontinua: referencia o dependencia. PK/FK: claves y referencias conceptuales, no SQL.</text><text x="45" y="841" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">* Inferencia justificada en DV-06_RELACIONES.csv; extremo sin número: no fijado por la fuente. No convertirlo en una restricción por defecto.</text><text x="45" y="859" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">Método/plantilla: versión exacta. R056 y R058 representan historia; no múltiples referencias/respuestas efectivas simultáneas.</text><text x="45" y="877" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 / H-07-DOM-01). No autoriza DDL ni elimina historia.</text></svg>