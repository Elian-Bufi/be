30 fechas locales)</text><text x="1852" y="504" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">exclusiones (con motivo)</text><text x="2125" y="528" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="600" text-anchor="end" fill="#53657D">T-06-44</text><rect x="688.2" y="269" width="50" height="18" rx="3" fill="white"/><text x="713.2" y="282" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R049 *</text><text x="615.4" y="309" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..N</text><text x="793" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><rect x="688.2" y="445" width="50" height="18" rx="3" fill="white"/><text x="713.2" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R050 *</text><text x="615.4" y="349" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><text x="793" y="445" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..1</text><rect x="310" y="479.45" width="50" height="18" rx="3" fill="white"/><text x="335" y="492.45" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R051</text><rect x="1194.4" y="445" width="50" height="18" rx="3" fill="white"/><text x="1219.4" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R052</text><rect x="1719.4" y="445" width="50" height="18" rx="3" fill="white"/><text x="1744.4" y="458" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R053</text><rect x="923.6" y="329" width="50" height="18" rx="3" fill="white"/><text x="948.6" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R054</text><rect x="30" y="804" width="2155" height="82" rx="7" fill="#F4F7FB"/><text x="45" y="823" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">Línea continua: asociación/composición conceptual. Discontinua: referencia o dependencia. PK/FK: claves y referencias conceptuales, no SQL.</text><text x="45" y="841" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">* Inferencia justificada en DV-06_RELACIONES.csv; extremo sin número: no fijado por la fuente. No convertirlo en una restricción por defecto.</text><text x="45" y="859" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">Los IDs Rxxx enlazan cada conector con pasaje literal completo, alcance y justificación. Versionado común: DV-06.4.</text><text x="45" y="877" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 / H-07-DOM-01). No autoriza DDL ni elimina historia.</text></svg>