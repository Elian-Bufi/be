<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1700" height="900" fill="#FFFFFF"/><text x="850" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-08.3 — Ambientes y régimen de datos</text><text x="850" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Tres ambientes con datos y credenciales propios. Cada promoción atraviesa un gate distinto.</text><line x1="40" y1="86" x2="1660" y2="86" stroke="#C9D3E0"/><path d="M462 270L688 270" stroke="#1F5FBF" stroke-width="1.5" fill="none" marker-end="url(#ab)" opacity=".85"/><rect x="519" y="255" width="113" height="26" rx="4" fill="#FFFFFF" opacity=".95"/><text x="576" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0F1C2E" text-anchor="middle">promueve artefacto</text><text x="576" y="279" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="middle">[commit SHA]</text><path d="M962 270L1188 270" stroke="#1F5FBF" stroke-width="1.5" fill="none" marker-end="url(#ab)" opacity=".85"/><rect x="1038" y="255" width="74" height="26" rx="4" fill="#FFFFFF" opacity=".95"/><text x="1076" y="267" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0F1C2E" text-anchor="middle">promueve</text><text x="1076" y="279" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="middle">[tras gate]</text><path d="M580 478L830 339" stroke="#1F5FBF" stroke-width="1.5" fill="none" marker-end="url(#ab)" opacity=".85"/><rect x="676" y="400" width="58" height="14" rx="4" fill="#FFFFFF" opacity=".95"/><text x="705" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0F1C2E" text-anchor="middle">habilita</text><path d="M1080 468L1330 349" stroke="#1F5FBF" stroke-width="1.5" fill="none" marker-end="url(#ab)" opacity=".85"/><rect x="1176" y="400" width="58" height="14" rx="4" fill="#FFFFFF" opacity=".95"/><text x="1205" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0F1C2E" text-anchor="middle">habilita</text><rect x="198" y="210" width="265" height="120" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="330" y="234" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Desarrollo</text><text x="330" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[local / branch dedicada]</text><text x="330" y="268" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">datos sintéticos</text><text x="330" y="281" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">guard anti-producción</text><text x="330" y="294" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">en suite unitaria</text><rect x="698" y="210" width="265" height="120" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="830" y="234" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Test / Demo</text><text x="830" y="250" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[Render Frankfurt]</text><text x="830" y="268" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">datos sintéticos únicamente</text><text x="830" y="281" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">usuarios demo por rol</text><text x="830" y="294" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">URL pública para la mesa</text><rect x="1198" y="200" width="265" height="140" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.8" stroke-dasharray="5 3"/><text x="1330" y="224" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Producción</text><text x="1330" y="240" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#C98F2C" text-anchor="middle">[Render Frankfurt · AWS-ready]</text><text x="1330" y="258" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">datos reales</text><text x="1330" y="271" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">requiere Ready-for-Real-Data</text><text x="1330" y="284" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">no habilitado</text><rect x="485" y="478" width="190" height="84" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="580" y="502" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Gate T-01/T-03</text><text x="580" y="518" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[ambientes]</text><text x="580" y="536" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">config y secretos</text><text x="580" y="549" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">separados</text><rect x="972" y="468" width="215" height="104" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1080" y="492" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Gate RfRD</text><text x="1080" y="508" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[VJR-1…9 · WORM]</text><text x="1080" y="526" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">evaluación jurídica</text><text x="1080" y="539" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">backups gobernados</text><text x="1080" y="552" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">journal de auditoría</text><rect x="300" y="650" width="1300" height="104" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="322" y="676" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C98F2C" text-anchor="start">07 §26-bis — tres ambientes, tres regímenes de datos</text><text x="322" y="698" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Desarrollo y Test/Demo operan exclusivamente con datos sintéticos generados: no se admiten datos reales ni anonimizados de personas.</text><text x="322" y="715" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">La demo académica se ejecuta en Test/Demo y no activa los gates de Ready-for-Real-Data: esos gates protegen datos reales, que la demo no usa.</text><text x="322" y="732" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Ningún ambiente está desplegado al momento de esta figura: la topología es objetivo, no estado verificado.</text><rect x="40" y="775" width="680" height="85" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><rect x="60" y="784" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7"/><text x="108" y="797" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Contenedor o sistema BE</text><rect x="60" y="805" width="36" height="18" rx="4" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="108" y="818" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Sistema externo</text><line x1="60" y1="835" x2="96" y2="835" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="839" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Relación con protocolo</text><text x="754" y="797" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`ASR-08` / `RNF-SEC-004` P0: ambientes separados con datos, configuración y credenciales propios.</text><text x="754" y="816" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`ASR-09`: artefacto inmutable ligado a commit SHA; migraciones como fase explícita; rollback definido.</text><text x="754" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">El gate de Ready-for-Real-Data es independiente del gate de implementación.</text><text x="754" y="854" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="754" y="873" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-07 v0.1.11 §26, §26-bis y §32 · sin cambio semántico</text><rect x="40" y="867" width="438" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1"/><text x="259" y="881" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">ARQUITECTURA OBJETIVO SEGÚN BE-LEG-07 — DESPLIEGUE NO VERIFICADO</text></svg>