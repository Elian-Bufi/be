" y1="835" x2="96" y2="835" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="839" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Relación con protocolo</text><text x="754" y="797" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">El PDP es punto único de decisión dentro de la API: idéntico para Website y APK (`ASR-06`).</text><text x="754" y="816" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`CAND-07-A`: se conserva el monolito modular; la modularidad es interna, no de despliegue.</text><text x="754" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`Q-008`: Render-first con AWS-ready declarado; el proveedor no condiciona el diseño.</text><text x="754" y="854" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="754" y="873" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-07 v0.1.11 §17 y §32 · sin cambio semántico</text><rect x="40" y="867" width="438" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1"/><text x="259" y="881" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">ARQUITECTURA OBJETIVO SEGÚN BE-LEG-07 — DESPLIEGUE NO VERIFICADO</text></svg>