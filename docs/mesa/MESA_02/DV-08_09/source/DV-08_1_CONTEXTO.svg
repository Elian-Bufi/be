dth="1.5"/><text x="60" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="839" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Relación con protocolo</text><text x="754" y="797" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`RF-059`: la caída de un tercero no bloquea el núcleo; el fallback es observable, nunca silencioso.</text><text x="754" y="816" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`ASR-10`: capa de puertos y adaptadores con timeout, fallback y procedencia conservada.</text><text x="754" y="835" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Las integraciones están especificadas; su contrato vive en `BE-LEG-09`.</text><text x="754" y="854" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="754" y="873" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-07 v0.1.11 §16 y §23 · sin cambio semántico</text><rect x="40" y="867" width="438" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1"/><text x="259" y="881" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">ARQUITECTURA OBJETIVO SEGÚN BE-LEG-07 — DESPLIEGUE NO VERIFICADO</text></svg>