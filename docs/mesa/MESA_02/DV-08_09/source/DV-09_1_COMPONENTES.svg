<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="900" viewBox="0 0 2200 900"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A" /></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF" /></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C" /></marker></defs><rect width="2200" height="900" fill="#FFFFFF" /><text x="1100" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-09.1 — C4 nivel 3 — Componentes del backend</text><text x="1100" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Dieciocho componentes en un solo despliegue. Cada uno declara la familia API que expone y el área de dominio que gobierna.</text><line x1="40" y1="86" x2="2160" y2="86" stroke="#C9D3E0" /><rect x="90" y="105" width="1500" height="630" rx="12" fill="none" stroke="#1F5FBF" stroke-width="1.3" stroke-dasharray="8 5" opacity=".55" /><text x="110" y="123" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#1F5FBF" text-anchor="start">API BE (NestJS) — un solo despliegue</text><rect x="40" y="752.0" width="690" height="106" rx="10" fill="#FBFCFE" stroke="#C9D3E0" /><rect x="60" y="761.0" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7" /><text x="108" y="774.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Componente de dominio</text><rect x="60" y="782.0" width="36" height="18" rx="4" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><text x="108" y="795.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Componente transversal</text><rect x="60" y="803.0" width="36" height="18" rx="4" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3" /><text x="108" y="816.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Adaptador externo</text><line x1="60" y1="833.0" x2="96" y2="833.0" stroke="#1F5FBF" stroke-width="1.5" /><text x="108" y="837.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Dependencia declarada</text><text x="764" y="774.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Cross-cutting en azul suave: borde HTTP, PDP (`ASR-06`), auditoría (`ASR-07`), emisión (`ASR-01`), motor temporal (`ASR-14`).</text><text x="764" y="793.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Las dependencias de cada componente de dominio hacia los transversales se rotulan bajo la caja (→) y se detallan en DV-09.2, la matriz completa.</text><text x="764" y="812.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Frontera transaccional = límite del componente de emisión: mutar agregados y publicar eventos ocurre en una sola transacción Prisma.</text><text x="764" y="831.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Proyecciones acceden a la base solo en lectura: son derivadas y no tienen autoridad de escritura (`CONV-06-09`).</text><text x="764" y="850.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Los motores de cálculo son puros y sin estado: módulo compartido único, deterministas.</text><text x="764" y="869.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start" /><text x="764" y="888.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-07 v0.1.11 §18 · sin cambio semántico</text><rect x="40" y="865.0" width="405" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1" /><text x="243" y="879.0" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">COMPONENTES OBJETIVO SEGÚN BE-LEG-07 — CÓDIGO NO VERIFICADO</text><g transform="translate(-59.5 30)"><rect x="192" y="129" width="215" height="92" rx="9" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="2.1" /><text x="300" y="153" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Borde HTTP</text><text x="300" y="169" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[guards · pipes · filter]</text><text x="300" y="187" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">correlación · rate limit</text><text x="300" y="236" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ PDP</text></g><g transform="translate(-5.5 30)"><rect x="438" y="129" width="215" height="92" rx="9" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="2.1" /><text x="545" y="153" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">PDP — autorización</text><text x="545" y="169" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[7 dimensiones]</text><text x="545" y="187" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">por operación, sin caché</text><text x="545" y="236" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ PostgreSQL</text></g><g transform="translate(50.5 30)"><rect x="682" y="129" width="215" height="92" rx="9" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="2.1" /><text x="790" y="153" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Auditoría de acceso</text><text x="790" y="169" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[interceptor + servicio]</text><text x="790" y="187" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">bloqueante, en transacción</text><text x="790" y="236" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ PostgreSQL</text></g><g transform="translate(104.5 30)"><rect x="928" y="129" width="215" height="92" rx="9" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="2.1" /><text x="1035" y="153" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Emisión de eventos</text><text x="1035" y="169" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[servicio núcleo]</text><text x="1035" y="187" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">evento + detalle en la misma tx</text><text x="1035" y="236" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ PostgreSQL</text></g><g transform="translate(-59.5 -40)"><rect x="192" y="354" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="300" y="378" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Identidad y acceso</text><text x="300" y="394" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[ACC]</text><text x="300" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-01</text></g><g transform="translate(-5.5 -40)"><rect x="438" y="354" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="545" y="378" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Verificación</text><text x="545" y="394" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[PRO]</text><text x="545" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-02</text></g><g transform="translate(50.5 -40)"><rect x="682" y="354" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="790" y="378" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Vínculos y consent.</text><text x="790" y="394" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[REL · CON · FRM]</text><text x="790" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-03</text></g><g transform="translate(104.5 -40)"><rect x="928" y="354" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="1035" y="378" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Habilitación y capacidad</text><text x="1035" y="394" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[PRO]</text><text x="1035" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-05</text><text x="1035" y="461" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ Motor temporal</text></g><g transform="translate(160.5 -40)"><rect x="1172" y="354" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="1280" y="378" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Procesos operativos</text><text x="1280" y="394" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[—]</text><text x="1280" y="412" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-04</text><text x="1280" y="461" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ Emisión</text></g><g transform="translate(-59.5 -75)"><rect x="192" y="544" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="300" y="568" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Nutrición</text><text x="300" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="