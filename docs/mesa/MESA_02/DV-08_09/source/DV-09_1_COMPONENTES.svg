#1F5FBF" text-anchor="middle">→ Emisión · Motores</text></g><g transform="translate(104.5 -75)"><rect x="928" y="544" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="1035" y="568" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Revisión y continuidad</text><text x="1035" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[—]</text><text x="1035" y="602" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-10</text><text x="1035" y="651" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ Emisión</text></g><g transform="translate(160.5 -75)"><rect x="1172" y="544" width="215" height="92" rx="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><text x="1280" y="568" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Proyecciones</text><text x="1280" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1F5FBF" text-anchor="middle">[DSH · PRJ · CRD]</text><text x="1280" y="602" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="middle">M-11</text><text x="1280" y="651" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">→ PostgreSQL (lectura)</text></g><g transform="translate(160.5 30)"><rect x="1172" y="129" width="215" height="92" rx="9" fill="#EAF1FB" stroke="#1F5FBF" stroke-width="2.1" /><text x="1280" y="153" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Motores de cálculo</te