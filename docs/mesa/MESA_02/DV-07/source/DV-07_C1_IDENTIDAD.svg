#9FBFEA" stroke-width="1" opacity=".45" /><text x="592" y="484" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ emitirVersión()</text><text x="808" y="485" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-04</text><rect x="932" y="110" width="235" height="141" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="932" y="110" width="235" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="1050" y="128" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Método de acceso</text><line x1="932" y1="138" x2="1168" y2="138" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="942" y="154" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- métodoId: identificador</text><text x="942" y="168" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- tipo: local | federado</text><text x="942" y="184" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- proveedor: ref externa</text><line x1="932" y1="190" x2="1168" y2="190" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="942" y="206" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ asociar() [no crea identidad paralela]</text><text x="942" y="222" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ desasociar()</text><rect x="938" y="230" width="223" height="17" rx="3" fill="#EAF1FB" /><text x="1050" y="242" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: REG-06-19}</text><text x="1158" y="242" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-03</text><rect x="932" y="380" width="235" height="121" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="932" y="380" width="235" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="1050" y="398" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Incidencia administrativa</text><line x1="932" y1="408" x2="1168" y2="408" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="942" y="424" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- incidenciaId: identificador</text><text x="942" y="438" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- categoría: descriptor</text><text x="942" y="454" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- estado: EstadoIncidencia</text><line x1="932" y1="460" x2="1168" y2="460" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="942" y="476" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ iniciarSeguimiento()</text><text x="942" y="492" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ resolver() [existe evidencia suficiente de resolución]</text><text x="1158" y="492" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-06</text><rect x="185" y="516" width="270" height="88" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="185" y="516" width="270" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="320" y="534" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Cierre de cuenta</text><line x1="185" y1="544" x2="455" y2="544" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="195" y="560" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- cierreId: identificador</text><text x="195" y="575" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- confirmación: acto explícito</text><rect x="191" y="583" width="258" height="17" rx="3" fill="#EAF1FB" /><text x="320" y="595" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: no destructivo}</text><text x="446" y="596" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-05</text><rect x="40" y="714" width="660" height="106" rx="10" fill="#FBFCFE" stroke="#C9D3E0" /><rect x="60" y="723" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7" /><text x="108" y="736" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase del dominio</text><rect x="60" y="744" width="36" height="18" rx="4" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><text x="108" y="757" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase versionada — patrón M-06</text><rect x="60" y="765" width="36" height="18" rx="4" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3" /><text x="108" y="778" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase de otra área — referenciada</text><line x1="60" y1="795" x2="96" y2="795" stroke="#1F5FBF" stroke-width="1.5" /><text x="60" y="790" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="790" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="799" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Asociación con multiplicidad</text><text x="734" y="736" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Atributos resumidos; detalle nominal en DV-06.1. Visibilidad UML: - atributos, + operaciones.</text><text x="734" y="755" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Cada operación lleva [guarda] de la lista blanca de §5.7.4. Sin guarda, la operación mentiría por omisión.</text><text x="734" y="774" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Máquina completa en DV-07.E1.</text><text x="734" y="793" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start" /><text x="734" y="812" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §5 · sin cambio semántico</text><rect x="40" y="827" width="485" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1" /><text x="282" y="841" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">ESTADO: CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 · H-07-