10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- ocurrencia: fecha-hora</text><text x="195" y="304" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- registro: fecha-hora</text><text x="195" y="318" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- procedencia: origen</text><line x1="185" y1="326" x2="455" y2="326" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="195" y="342" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ suspenderCuenta() [existe fundamento válido según política posterior]</text><text x="195" y="356" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ restablecerCuenta() [cesó o fue resuelta la condición de suspensión según política]</text><text x="195" y="372" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ cerrarCuenta() [sesión/autorización aplicables, consecuencias presentadas y confirmación explícita]</text><rect x="191" y="380" width="258" height="17" rx="3" fill="#EAF1FB" /><text x="320" y="392" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: INV-06-01 · identidad ≠ perfil ≠ vínculo}</text><text x="446" y="392" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-01</text><rect x="598" y="138" width="205" height="83" rx="7" fill="#F7F9FC" stroke="#6B7A90" stroke-width="1.3" /><rect x="598" y="138" width="205" height="28" rx="7" fill="#6B7A90" opacity="0.12" /><text x="700" y="150" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="600" fill="#6B7A