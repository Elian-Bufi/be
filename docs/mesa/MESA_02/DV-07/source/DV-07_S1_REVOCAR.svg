<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="880" viewBox="0 0 1860 880"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1860" height="880" fill="#FFFFFF"/><text x="930" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.S1 — Secuencia — Revocar consentimiento (UC-P08)</text><text x="930" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">El corte es prospectivo: revocar no borra, no finaliza el vínculo y no revoca el consentimiento profesional por mutación.</text><line x1="40" y1="86" x2="1820" y2="86" stroke="#C9D3E0"/><path d="M220 250L511 250" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="370" y="241" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">revocar(consentimientoId)</text><path d="M520 290L811 290" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="670" y="281" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">evaluar(7 dimensiones)</text><path d="M820 325L529 325" stroke="#6B7A90" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/><text x="670" y="316" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6B7A90" text-anchor="middle">titular autorizado</text><path d="M520 370L1111 370" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="820" y="361" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">revocar() [versión + evento]</text><path d="M1120 410L1691 410" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="1410" y="401" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">ConsentimientoRevocado</text><path d="M1120 450L529 450" stroke="#6B7A90" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/><text x="820" y="441" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6B7A90" text-anchor="middle">estado = REVOCADO</text><path d="M520 490L229 490" stroke="#6B7A90" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/><text x="370" y="481" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6B7A90" text-anchor="middle">confirmación sin promesa de borrado</text><rect x="145" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1FA97A" stroke-width="1.8"/><text x="220" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Asesorado</text><line x1="220" y1="212" x2="220" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="445" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="520" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">UX / API</text><line x1="520" y1="212" x2="520" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="745" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="820" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">PDP</text><line x1="820" y1="212" x2="820" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1045" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1120" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Consentimiento</text><line x1="1120" y1="212" x2="1120" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1345" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1420" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Vínculo</text><line x1="1420" y1="212" x2="1420" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1625" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1700" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Auditoría</text><line x1="1700" y1="212" x2="1700" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1060" y="530" width="720" height="120" rx="6" fill="none" stroke="#6B7A90" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M1060 530h72l14 20H1060z" fill="#FFFFFF" stroke="#6B7A90" stroke-width="1.2"/><text x="1096" y="544" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6B7A90" text-anchor="middle">note</text><text x="1160" y="544" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="start">efectos que NO ocurren en esta transacción</text><text x="1080" y="572" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">El Vínculo NO se finaliza: conserva su estado por alcance.</text><text x="1080" y="591" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">El B2 NO se revoca por mutación: queda sin capacidad efectiva.</text><text x="1080" y="610" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">NO se borra historia dentro de la transacción (08 §13, §16, §17).</text><text x="1080" y="629" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">El corte es prospectivo: las operaciones siguientes fallan en el PDP.</text><rect x="513" y="240" width="14" height="260" rx="3" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.4"/><rect x="1113" y="360" width="14" height="100" rx="3" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.4"/><rect x="40" y="776" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="794" x2="96" y2="794" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="789" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="789" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="798" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Llamada / paso del flujo</text><line x1="60" y1="815" x2="96" y2="815" stroke="#1F5FBF" stroke-width="1.4" stroke-dasharray="5 4"/><text x="108" y="819" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Retorno o efecto derivado</text><text x="734" y="798" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">La autorización se evalúa antes de cualquier efecto: precedencia PDP → schema (09 §20.2.1).</text><text x="734" y="817" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`CON-08` es idempotente: `REVOCADO → REVOCADO` no produce un segundo efecto ni un error.</text><text x="734" y="836" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Reotorgar exige un acto nuevo que preserva la revocación previa.</text><text x="734" y="855" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="874" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Deriva de BE-LEG-05 v0.15 UC-P08 · BE-LEG-06 §7.7 · BE-LEG-08 §13 · BE-LEG-09 CON-08</text></svg>