<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="810" viewBox="0 0 1380 810"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1380" height="810" fill="#FFFFFF"/><text x="690" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.E5 — Máquina — Consentimiento (T-06-17)</text><text x="690" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Versionado: aceptar una nueva versión no crea un consentimiento distinto; revocar no borra la evidencia.</text><line x1="40" y1="86" x2="1340" y2="86" stroke="#C9D3E0"/><path d="M208 320L375 320" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="292" y="308" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">OtorgarConsentimiento</text><path d="M496 320Q686 264 875 320" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="589" y="213" width="193" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="686" y="225" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">RevocarConsentimiento</text><text x="686" y="238" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[Versión + evento de revocación]</text><text x="686" y="251" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ ConsentimientoRevocado</text><path d="M884 320Q694 376 505 320" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="556" y="388" width="277" height="28" rx="4" fill="#FFFFFF" opacity=".95"/><text x="694" y="400" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">OtorgarNuevamente</text><text x="694" y="413" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[nueva decisión explícita cuando 08 lo permita]</text><path d="M414 298C400 254 480 254 466 295" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="440" y="258" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">AceptarNuevaVersion</text><text x="440" y="271" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[Versión sucesora explícita]</text><rect x="384" y="298" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="440" y="325" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">VIGENTE</text><rect x="884" y="298" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="940" y="325" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">REVOCADO</text><circle cx="200" cy="320" r="8" fill="#1FA97A"/><rect x="300" y="540" width="900" height="104" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="320" y="564" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C98F2C" text-anchor="start">Corte prospectivo</text><text x="320" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">La revocación corta hacia adelante: no borra historia dentro de la transacción,</text><text x="320" y="600" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">no finaliza vínculos automáticamente, y el B2 queda sin capacidad efectiva</text><text x="320" y="616" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">mientras el A3 no satisfaga el PDP (08 §56).</text><rect x="40" y="706" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="724" x2="96" y2="724" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="719" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="719" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="728" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Transición declarada en la lista blanca</text><rect x="60" y="736" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7"/><text x="108" y="749" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Estado del conjunto cerrado</text><text x="734" y="728" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Nombre de transición en azul · [guarda] en gris · / evento emitido en verde. Las guardas son la columna «condiciones» literal de la lista blanca.</text><text x="734" y="747" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Toda transición no declarada está prohibida.</text><text x="734" y="766" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="785" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §7.7 · lista blanca literal · sin cambio semántico</text></svg>