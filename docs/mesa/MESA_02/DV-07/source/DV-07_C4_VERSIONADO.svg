e="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-21</text><rect x="598" y="400" width="245" height="141" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="598" y="400" width="245" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="720" y="418" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Corrección trazable</text><line x1="598" y1="428" x2="842" y2="428" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="608" y="444" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- correcciónId: identificador</text><text x="608" y="458" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- original: ref raíz</text><text x="608" y="474" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- correcciónPrevia: ref, opcional</text><text x="608" y="488" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- motivo: texto</text><line x1="598" y1="496" x2="842" y2="496" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="608" y="512" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ corregir() [no reasigna autoría del original]</text><rect x="604" y="520" width="233" height="17" rx="3" fill="#EAF1FB" /><text x="720" y="532" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: aditiva, nunca destructiva}</text><text x="834" y="532" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-22</text><rect x="968" y="146" width="225" height="68" rx="7" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><rect x="968" y="146" width="225" height="28" rx="7" fill="#9FBFEA" opacity="0.12" /><text x="1080" y="164" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Procedencia</text><line x1="968" y1="174" x2="1192" y2="174" stroke="#9FBFEA" stroke-width="1" opacity=".45" /><text x="978" y="190" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- actor · fuente</text><text x="978" y="205" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- proveedor · contexto</text><text x="1184" y="206" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-23</text><rect x="968" y="426" width="225" height="88" rx="7" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><rect x="968" y="426" width="225" height="28" rx="7" fill="#9FBFEA" opacity="0.12" /><text x="1080" y="444" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Doble temporalidad</text><line x1="968" y1="454" x2="1192" y2="454" stroke="#9FBFEA" stroke-width="1" opacity=".45" /><text x="978" y="470" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- ocurrencia: fecha-hora</text><text x="978" y="485" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- registro: fecha-hora</text><rect x="974" y="493" width="213" height="17" rx="3" fill="#EAF1FB" /><text x="1080" y="505" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: el desconocido no se inventa}</text><text x="1184" y="506" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-24</text><rect x="40" y="694" width="660" height="106" rx="10" fill="#FBFCFE" stroke="#C9D3E0" /><rect x="60" y="703" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7" /><text x="108" y="716" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase del dominio</text><rect x="60" y="724" width="36" height="18" rx="4" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><text x="108" y="737" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase versionada — patrón M-06</text><rect x="60" y="745" width="36" height="18" rx="4" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3" /><text x="108" y="758" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase de otra área — referenciada</text><line x1="60" y1="775" x2="96" y2="775" stroke="#1F5FBF" stroke-width="1.5" /><text x="60" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="770" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="779" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Asociación con multiplicidad</text><text x="734" y="716" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Guardas de §4.5 y §4.7. La máquina de Versión de plan está en DV-07.E7.</text><text x="734" y="735" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`REG-06-16`: la vista efectiva se determina por relación de corrección, nunca por «última fecha».</text><text x="734" y="754" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">R019: máximo de instantáneas por versión según área; no se fija 0..1 universal.</text><text x="734" y="773" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start" /><text x="734" y="792" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §4 · sin cambio semántico</text><rect x="40" y="807" width="485" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1" /><text x="282" y="821" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">ESTADO: CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 · H-07-DOM-01)</text></svg>