<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="830" viewBox="0 0 1480 830"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1480" height="830" fill="#FFFFFF"/><text x="740" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.E2 — Máquina — Verificación profesional por alcance (T-06-11)</text><text x="740" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Opera por alcance, no globalmente: un profesional puede estar VERIFICADO en nutrición y PENDIENTE en entrenamiento.</text><line x1="40" y1="86" x2="1440" y2="86" stroke="#C9D3E0"/><path d="M138 340L255 340" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="238" y="328" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">PresentarAlcance</text><path d="M314 318C300 274 380 274 366 315" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="340" y="278" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">RegistrarObservacion</text><text x="340" y="291" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[versión exacta revisada + fundamento]</text><path d="M314 362C300 406 380 406 366 365" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="340" y="414" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">PresentarSubsanacion</text><text x="340" y="427" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[subsanación admitida]</text><path d="M1124 340Q764 530 405 340" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="676" y="609" width="176" height="28" rx="4" fill="#FFFFFF" opacity=".95"/><text x="764" y="621" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">VolverAPresentar</text><text x="764" y="634" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[nueva presentación admitida]</text><path d="M396 340Q546 284 695 340" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="477" y="233" width="137" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="546" y="245" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">VerificarAlcance</text><text x="546" y="258" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[resolución favorable]</text><text x="546" y="271" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ AlcanceVerificado</text><path d="M396 340Q756 222 1115 340" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="678" y="140" width="154" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="756" y="152" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">RechazarAlcance</text><text x="756" y="165" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[resolución desfavorable]</text><text x="756" y="178" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ AlcanceRechazado</text><path d="M816 340Q966 380 1115 560" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="872" y="322" width="188" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="966" y="334" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">SuspenderAlcance</text><text x="966" y="347" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[resolución explícita + motivo]</text><text x="966" y="360" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ AlcanceSuspendido</text><path d="M1124 560Q974 520 825 340" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="906" y="532" width="137" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="974" y="544" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">RehabilitarAlcance</text><text x="974" y="557" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[resolución explícita]</text><text x="974" y="570" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ AlcanceRehabilitado</text><circle cx="130" cy="340" r="8" fill="#1FA97A"/><rect x="284" y="318" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="340" y="345" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">PENDIENTE</text><rect x="704" y="318" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="760" y="345" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">VERIFICADO</text><rect x="1124" y="318" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#0F1C2E" stroke-width="2.2"/><rect x="1128" y="322" width="104" height="36" rx="9" fill="none" stroke="#0F1C2E" stroke-width="1"/><text x="1180" y="345" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">RECHAZADO</text><rect x="1124" y="538" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="1180" y="565" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">SUSPENDIDO</text><rect x="300" y="560" width="430" height="92" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="320" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C98F2C" text-anchor="start">La observación NO es un quinto estado</text><text x="320" y="604" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Es un hecho trazable registrado dentro de PENDIENTE;</text><text x="320" y="620" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">la subsanación no cambia de estado, agrega evidencia.</text><text x="320" y="638" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Mínimo de DEC-005 vía DEC-042: los cuatro estados.</text><rect x="40" y="726" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="744" x2="96" y2="744" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="739" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="739" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="748" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Transición declarada en la lista blanca</text><rect x="60" y="756" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7"/><text x="108" y="769" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Estado del conjunto cerrado</text><text x="734" y="748" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Nombre de transición en azul · [guarda] en gris · / evento emitido en verde. Las guardas son la columna «condiciones» literal de la lista blanca.</text><text x="734" y="767" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`INV-06-01`: verificar ≠ habilitar ≠ autorizar. La verificación no concede acceso por sí sola.</text><text x="734" y="786" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Suspender un alcance no suspende los demás: no hay transversalidad automática.</text><text x="734" y="805" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="824" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §6.8 · lista blanca literal · sin cambio semántico</text></svg>