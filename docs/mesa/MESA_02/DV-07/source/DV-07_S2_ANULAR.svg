<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="900" viewBox="0 0 1880 900"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1880" height="900" fill="#FFFFFF"/><text x="940" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.S2 — Secuencia — Anular medición antropométrica (UC-E03)</text><text x="940" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Anular es condición local: preserva el original, reevalúa dependencias y expone SIN_DATO sin inventar sucesores.</text><line x1="40" y1="86" x2="1840" y2="86" stroke="#C9D3E0"/><path d="M220 250L511 250" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="370" y="241" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">anular(mediciónId, motivo)</text><path d="M520 288L791 288" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="660" y="279" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">evaluar(autorización por operación)</text><path d="M800 322L529 322" stroke="#6B7A90" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/><text x="660" y="313" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6B7A90" text-anchor="middle">profesional autorizado</text><path d="M520 364L1071 364" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="800" y="355" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">anular() [VIGENTE ∧ motivo]</text><path d="M1080 404L1371 404" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="1230" y="395" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">input anulado → reevaluar (REG-06-159)</text><path d="M1380 444L1671 444" stroke="#1F5FBF" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><text x="1530" y="435" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">resultado no vigente</text><path d="M1680 484L529 484" stroke="#6B7A90" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/><text x="1100" y="475" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6B7A90" text-anchor="middle">serie con SIN_DATO explícito</text><path d="M520 524L229 524" stroke="#6B7A90" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ab)"/><text x="370" y="515" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6B7A90" text-anchor="middle">anulada · original preservado</text><rect x="145" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1FA97A" stroke-width="1.8"/><text x="220" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Profesional</text><line x1="220" y1="212" x2="220" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="445" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="520" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">UX / API</text><line x1="520" y1="212" x2="520" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="725" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="800" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">PDP</text><line x1="800" y1="212" x2="800" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1005" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1080" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Medición</text><line x1="1080" y1="212" x2="1080" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1302" y="168" width="155" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1380" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Cálculo derivado</text><line x1="1380" y1="212" x2="1380" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1605" y="168" width="150" height="44" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8"/><text x="1680" y="195" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#0F1C2E" text-anchor="middle">Evolución</text><line x1="1680" y1="212" x2="1680" y2="700" stroke="#C9D3E0" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1020" y="566" width="780" height="116" rx="6" fill="none" stroke="#6B7A90" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M1020 566h72l14 20H1020z" fill="#FFFFFF" stroke="#6B7A90" stroke-width="1.2"/><text x="1056" y="580" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6B7A90" text-anchor="middle">note</text><text x="1120" y="580" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="500" fill="#6B7A90" text-anchor="start">garantías del legajo en este flujo</text><text x="1040" y="608" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">El original NO se borra: queda con condición ANULADA y motivo (RF-050).</text><text x="1040" y="627" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Si no hay inputs suficientes, NO se inventa un sucesor del cálculo.</text><text x="1040" y="646" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">La evolución expone SIN_DATO: nunca cero, nunca interpolación (INV-06-176).</text><text x="1040" y="665" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">No existe operación de reversión: ANULADA → VIGENTE no está declarada.</text><rect x="513" y="240" width="14" height="294" rx="3" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.4"/><rect x="1073" y="354" width="14" height="60" rx="3" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.4"/><rect x="40" y="796" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="814" x2="96" y2="814" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="809" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="809" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="818" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Llamada / paso del flujo</text><line x1="60" y1="835" x2="96" y2="835" stroke="#1F5FBF" stroke-width="1.4" stroke-dasharray="5 4"/><text x="108" y="839" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Retorno o efecto derivado</text><text x="734" y="818" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`REG-06-16 inciso 4`: la anulación es condición local de M-09; no redefine el patrón común B-06.</text><text x="734" y="837" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`REG-06-159`: un input anulado obliga a reevaluar dependencias sin reescribir históricos.</text><text x="734" y="856" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Una nueva observación válida se registra como nueva medición, no como reactivación.</text><text x="734" y="875" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="894" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Deriva de BE-LEG-05 v0.15 UC-E03 · BE-LEG-06 §13 y §20.6 · BE-LEG-09 ANT-12</text></svg>