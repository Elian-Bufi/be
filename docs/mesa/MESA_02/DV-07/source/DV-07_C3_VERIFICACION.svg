ad, opcional)</text><text x="1819.5" y="580" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- modoEfectivo (token: LIMITADO | SIN_LIMITE)</text><text x="2099.5" y="604" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="600" text-anchor="end" fill="#53657D">T-06-14</text><rect x="220" y="435.5" width="340" height="109" rx="7" fill="#FBF1DC" stroke="#1F5FBF" stroke-width="1.5"/><text x="390" y="456.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0F1C2E">Identidad BE</text><line x1="220" y1="465.5" x2="560" y2="465.5" stroke="#BCCBE0"/><text x="231" y="482.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- identidadId (identificador)</text><text x="231" y="497.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- estadoCuenta (token)</text><text x="231" y="512.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- perfilProfesionalRef (opcional)</text><text x="550" y="536.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="600" text-anchor="end" fill="#53657D">referencia 06</text><rect x="713" y="643.5" width="340" height="109" rx="7" fill="#FBF1DC" stroke="#1F5FBF" stroke-width="1.5"/><text x="883" y="664.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0F1C2E">Alcance profesional</text><line x1="713" y1="673.5" x2="1053" y2="673.5" stroke="#BCCBE0"/><text x="724" y="690.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- identidadRef (ref profesional)</text><text x="724" y="705.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" t