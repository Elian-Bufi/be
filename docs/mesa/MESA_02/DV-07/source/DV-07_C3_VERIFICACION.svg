45.5" y="420" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">+ rechazar() [resolución desfavorable]</text><text x="1245.5" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">+ suspender() [resolución explícita + motivo]</text><text x="1245.5" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">+ rehabilitar() [resolución explícita]</text><text x="1245.5" y="465" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">{inv: verificar ≠ habilitar ≠ autorizar}</text><text x="1581.5" y="489" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" font-weight="600" text-anchor="end" fill="#53657D">T-06-11</text><rect x="1234.5" y="598" width="357" height="124" rx="7" fill="white" stroke="#1F5FBF" stroke-width="1.5"/><text x="1413" y="619" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#0F1C2E">Observación / subsanación</text><line x1="1234.5" y1="628" x2="1591.5" y2="628" stroke="#BCCBE0"/><text x="1245.5" y="645" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- observaciónId (identificador)</text><text x="1245.5" y="660" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- verificaciónRef (ref Verificación)</text><text x="1245.5" y="675" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- motivo (texto)</text><text x="1245.5" y="690" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#53657D">- subsanadaEn (fecha-hora, opcional)</text><text x="1581.5" y="714" font-family="Inter,Segoe UI