th="50" height="18" rx="3" fill="white"/><text x="1478" y="573.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R010 *</text><text x="1413" y="516" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><text x="1413" y="579" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..N</text><rect x="1684" y="256" width="50" height="18" rx="3" fill="white"/><text x="1709" y="269" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R011</text><rect x="1168.25" y="541" width="50" height="18" rx="3" fill="white"/><text x="1193.25" y="554" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R012 *</text><text x="579" y="501" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><text x="1789.5" y="541" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..1</text><rect x="280" y="359.75" width="50" height="18" rx="3" fill="white"/><text x="305" y="372.75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R063</text><text x="390" y="416.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><text x="390" y="321" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..1</text><rect x="536.5" y="669" width="50" height="18" rx="3" fill="white"/><text x="561.5" y="682" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">R064 *</text><text x="430" y="563.5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">1</text><text x="694" y="669" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" text-anchor="middle" fill="#53657D">0..N</text><rect x="30" y="804" width="2130" height="82" rx="7" fill="#F4F7FB"/><text x="45" y="823" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">Visibilidad UML: - atributo, + operación. Referencias y multiplicidades coherentes con DV-06.2; los IDs Rxxx enlazan su evidencia.</text><text x="45" y="841" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">* Inferencia justificada en DV-06_RELACIONES.csv; extremo sin número: no fijado por la fuente. No convertirlo en una restricción por defecto.</text><text x="45" y="859" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">Alcance profesional = identidad + especialidad o capacidad antropométrica. Verificación y habilitación son independientes; capacidad común por identidad.</text><text x="45" y="877" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#53657D">CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 / H-07-DOM-01). No autoriza DDL ni elimina historia.</text><text x="2155" y="790" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#53657D">Operaciones y guardas v4 preservadas · estados y transiciones: DV-07.E2</text></svg>