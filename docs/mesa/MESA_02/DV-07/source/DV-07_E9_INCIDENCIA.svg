<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="830" viewBox="0 0 1560 830"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1560" height="830" fill="#FFFFFF"/><text x="780" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.E9 — Máquina — Incidencia administrativa (T-06-06)</text><text x="780" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Ciclo propio que no modifica los dominios: para actuar, invoca el caso de uso propietario.</text><line x1="40" y1="86" x2="1520" y2="86" stroke="#C9D3E0"/><path d="M198 330L355 330" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="277" y="318" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">AbrirIncidencia</text><path d="M476 330Q628 280 779 330" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="450" y="232" width="356" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="628" y="244" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">IniciarSeguimiento</text><text x="628" y="257" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[incidencia visible/autorizada; existe acción de seguimiento]</text><text x="628" y="270" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ SeguimientoIniciado</text><path d="M932 330Q1083 280 1235 330" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="956" y="232" width="255" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="1083" y="244" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">ResolverIncidencia</text><text x="1083" y="257" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[existe evidencia suficiente de resolución]</text><text x="1083" y="270" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ IncidenciaResuelta</text><path d="M476 330Q856 440 1235 330" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="728" y="472" width="255" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="856" y="484" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">ResolverIncidencia</text><text x="856" y="497" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[existe evidencia suficiente de resolución]</text><text x="856" y="510" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ IncidenciaResuelta</text><rect x="364" y="308" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="420" y="335" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">ABIERTA</text><rect x="788" y="308" width="144" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="860" y="335" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">EN_SEGUIMIENTO</text><rect x="1244" y="308" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#0F1C2E" stroke-width="2.2"/><rect x="1248" y="312" width="104" height="36" rx="9" fill="none" stroke="#0F1C2E" stroke-width="1"/><text x="1300" y="335" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">RESUELTA</text><circle cx="190" cy="330" r="8" fill="#1FA97A"/><rect x="340" y="560" width="940" height="104" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="360" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C98F2C" text-anchor="start">No crea un estado nuevo por cada hecho</text><text x="360" y="604" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Mientras está EN_SEGUIMIENTO pueden agregarse hechos SeguimientoDeIncidenciaRegistrado</text><text x="360" y="620" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">sin crear estados adicionales: el seguimiento es evidencia, no máquina paralela.</text><text x="360" y="636" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">La incidencia nunca modifica un dominio por sí misma: invoca el caso propietario.</text><rect x="40" y="726" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="744" x2="96" y2="744" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="739" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="739" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="748" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Transición declarada en la lista blanca</text><rect x="60" y="756" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7"/><text x="108" y="769" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Estado del conjunto cerrado</text><text x="734" y="748" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Nombre de transición en azul · [guarda] en gris · / evento emitido en verde. Las guardas son la columna «condiciones» literal de la lista blanca.</text><text x="734" y="767" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Toda transición no declarada está prohibida.</text><text x="734" y="786" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="805" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §5.10 · lista blanca literal · sin cambio semántico</text></svg>