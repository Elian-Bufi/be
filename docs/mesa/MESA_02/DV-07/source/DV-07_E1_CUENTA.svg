<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="790" viewBox="0 0 1420 790"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1420" height="790" fill="#FFFFFF"/><text x="710" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.E1 — Máquina — Estado operativo de cuenta (T-06-02)</text><text x="710" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Tres estados, tres transiciones. Toda transición no declarada está prohibida.</text><line x1="40" y1="86" x2="1380" y2="86" stroke="#C9D3E0"/><path d="M158 300L275 300" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="255" y="288" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="600" fill="#1FA97A" text-anchor="middle">registro exitoso</text><path d="M416 300Q556 248 695 300" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="406" y="199" width="300" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="556" y="211" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">SuspenderCuenta</text><text x="556" y="224" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[existe fundamento válido según política posterior]</text><text x="556" y="237" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ CuentaSuspendida</text><path d="M704 300Q564 352 425 300" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="381" y="355" width="367" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="564" y="367" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">RestablecerCuenta</text><text x="564" y="380" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[cesó o fue resuelta la condición de suspensión según política]</text><text x="564" y="393" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ CuentaRestablecida</text><path d="M416 300Q756 450 1095 300" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="513" y="502" width="484" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="756" y="514" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">CerrarCuenta</text><text x="756" y="527" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[sesión/autorización aplicables, consecuencias presentadas y confirmación explícita]</text><text x="756" y="540" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ CuentaCerrada</text><circle cx="150" cy="300" r="8" fill="#1FA97A"/><rect x="304" y="278" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="360" y="305" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">OPERATIVA</text><rect x="704" y="278" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="760" y="305" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">SUSPENDIDA</text><rect x="1104" y="278" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#0F1C2E" stroke-width="2.2"/><rect x="1108" y="282" width="104" height="36" rx="9" fill="none" stroke="#0F1C2E" stroke-width="1"/><text x="1160" y="305" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">CERRADA</text><rect x="620" y="540" width="700" height="74" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="640" y="564" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C98F2C" text-anchor="start">Transiciones NO declaradas — prohibidas</text><text x="640" y="584" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">SUSPENDIDA → CERRADA: UC-P27 exige titular con sesión válida; 04/05 no aprobaron</text><text x="640" y="600" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">recorrido alternativo de cierre desde suspensión. CERRADA no tiene salida bajo M-01.</text><rect x="40" y="686" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="704" x2="96" y2="704" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="699" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="699" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="708" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Transición declarada en la lista blanca</text><rect x="60" y="716" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7"/><text x="108" y="729" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Estado del conjunto cerrado</text><text x="734" y="708" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Nombre de transición en azul · [guarda] en gris · / evento emitido en verde. Las guardas son la columna «condiciones» literal de la lista blanca.</text><text x="734" y="727" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Estado inicial tras registro exitoso: OPERATIVA. Estado terminal bajo M-01: CERRADA.</text><text x="734" y="746" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`CERRADA` no bloquea por sí misma: la autorización se evalúa por separado en cada operación.</text><text x="734" y="765" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="784" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §5.7 · lista blanca literal · sin cambio semántico</text></svg>