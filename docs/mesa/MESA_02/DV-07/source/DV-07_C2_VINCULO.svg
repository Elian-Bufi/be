ext><text x="178" y="278" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- estado: EstadoSolicitud</text><text x="178" y="294" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- antecedente: ref Solicitud</text><line x1="168" y1="300" x2="432" y2="300" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="178" y="316" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ aceptar() [confirmación explícita + reevaluación]</text><text x="178" y="332" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ rechazar() [confirmación explícita]</text><text x="178" y="346" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ caducar() [condición temporal]</text><text x="178" y="362" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ invalidar() [elegibilidad o contenido ya incompatibles]</text><rect x="174" y="370" width="253" height="17" rx="3" fill="#EAF1FB" /><text x="300" y="382" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: REG-06-44 · una sola PENDIENTE}</text><text x="424" y="382" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-16</text><rect x="562" y="204" width="255" height="171" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="562" y="204" width="255" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="690" y="222" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Vínculo — componente de alcance</text><line x1="562" y1="232" x2="818" y2="232" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="572" y="248" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- vínculoId: identificador</text><text x="572" y="264" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- alcance: ref Alcance</text><text x="572" y="278" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- estado: EstadoVínculo</text><text x="572" y="294" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- motivo: texto</text><line x1="562" y1="300" x2="818" y2="300" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="572" y="316" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ pausar() [decisión + motivo]</text><text x="572" y="332" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ reanudar() [decisión explícita]</text><text x="572" y="346" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ finalizar() [decisión explícita]</text><rect x="568" y="354" width="243" height="17" rx="3" fill="#EAF1FB" /><text x="690" y="366" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: opera por alcance, no global}</text><text x="808" y="368" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-15</text><rect x="562" y="522" width="255" height="156" rx="7" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><rect x="562" y="522" width="255" height="28" rx="7" fill="#9FBFEA" opacity="0.12" /><text x="690" y="540" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Consentimiento vigente</text><line x1="562" y1="550" x2="818" y2="550" stroke="#9FBFEA" stroke-width="1" opacity=".45" /><text x="572" y="566" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- consentimientoId: identificador</text><text x="572" y="581" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- versión: ref Versión</text><text x="572" y="596" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- finalidad: token</text><text x="572" y="611" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- otorgadoEn: fecha-hora</text><line x1="562" y1="618" x2="818" y2="618" stroke="#9FBFEA" stroke-width="1" opacity=".45" /><text x="572" y="634" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ aceptarNuevaVersión() [Versión sucesora explícita]</text><text x="572" y="649" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ revocar() [Versión + evento de revocación]</text><rect x="568" y="657" width="243" height="17" rx="3" fill="#EAF1FB" /><text x="690" y="669" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: revocar ≠ finalizar vínculo}</text><text x="808" y="670" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-17</text><rect x="958" y="370" width="265" height="141" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="958" y="370" width="265" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="1090" y="388" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Autorización contextual</text><line x1="958" y1="398" x2="1222" y2="398" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="968" y="414" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- identidad · verificación</text><text x="968" y="428" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- habilitación · vínculo</text><text x="968" y="444" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- consentimiento · alcance</text><text x="968" y="458" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- finalidad</text><line x1="958" y1="466" x2="1222" y2="466" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="968" y="482" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1F5FBF" text-anchor="start">+ evaluar() [RF-021: siete dimensiones, por operación]</text><rect x="964" y="490" width="253" height="17" rx="3" fill="#EAF1FB" /><text x="1090" y="502" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#1F5FBF" text-anchor="middle">{inv: INV-06-10 · nunca presumida}</text><text x="1214" y="502" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-19</text><rect x="982" y="138" width="215" height="83" rx="7" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.8" /><rect x="982" y="138" width="215" height="28" rx="7" fill="#1F5FBF" opacity="0.12" /><text x="1090" y="156" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">Alcance</text><line x1="982" y1="166" x2="1198" y2="166" stroke="#1F5FBF" stroke-width="1" opacity=".45" /><text x="992" y="182" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- alcanceId: identificador</text><text x="992" y="198" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- especialidad: ref, opcional</text><text x="992" y="212" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">- capacidad: ref, opcional</text><text x="1188" y="214" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#6B7A90" text-anchor="end">T-06-45</text><rect x="40" y="754" width="660" height="106" rx="10" fill="#FBFCFE" stroke="#C9D3E0" /><rect x="60" y="763" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7" /><text x="108" y="776" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase del dominio</text><rect x="60" y="784" width="36" height="18" rx="4" fill="#EAF1FB" stroke="#9FBFEA" stroke-width="1.3" /><text x="108" y="797" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase versionada — patrón M-06</text><rect x="60" y="805" width="36" height="18" rx="4" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3" /><text x="108" y="818" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Clase de otra área — referenciada</text><line x1="60" y1="835" x2="96" y2="835" stroke="#1F5FBF" stroke-width="1.5" /><text x="60" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="830" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="839" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Asociación con multiplicidad</text><text x="734" y="776" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Guardas de §7.3.2, §7.5.2 y §7.7.5. Máquinas completas en DV-07.E3, E4 y E5.</text><text x="734" y="795" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">`7.5-05`: revocar consentimiento no finaliza el vínculo; finalizar el vínculo no borra la evidencia.</text><text x="734" y="814" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">La autorización se evalúa por operación con las siete dimensiones de `RF-021`.</text><text x="734" y="833" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start" /><text x="734" y="852" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §7 · sin cambio semántico</text><rect x="40" y="867" width="485" height="21" rx="5" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1" /><text x="282" y="881" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#C98F2C" text-anchor="middle">ESTADO: CONCEPTUAL — A RECONCILIAR CON REPOSITORIO (B-11 · H-07-DOM-01)</text></svg>