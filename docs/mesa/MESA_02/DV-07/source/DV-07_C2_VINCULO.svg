<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A" /></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF" /></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C" /></marker></defs><rect width="1600" height="900" fill="#FFFFFF" /><text x="800" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.2 — Clases — Vínculo, consentimiento y autorización (M-03)</text><text x="800" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Cuatro dimensiones separadas. Ninguna operación de una concede lo que corresponde a otra.</text><line x1="40" y1="86" x2="1560" y2="86" stroke="#C9D3E0" /><path d="M432 290L562 290" stroke="#1F5FBF" stroke-width="1.5" fill="none" opacity=".8" /><text x="448" y="283" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6B7A90" text-anchor="middle">1</text><text x="544" y="283" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6B7A90" text-anchor="middle">0..1</text><path d="M690 376L690 522" stroke="#1F5FBF" stroke-width="1.5" fill="none" opacity=".8" /><text x="674" y="368" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6B7A90" text-anchor="middle">1</text><text x="708" y="515" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#6B7A90" text-anchor="middle">0..N</text><path d="M818 290L958 440" stroke="#1F5FBF" stroke-width="1.5" fill="none" stroke-dasharray="6 4" opac