<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><defs><marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1FA97A"/></marker><marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#1F5FBF"/></marker><marker id="aa" markerWidth="8" markerHeight="8" refX="7" refY="2.6" orient="auto"><path d="M0,0 L0,5.2 L7,2.6 z" fill="#C98F2C"/></marker></defs><rect width="1440" height="790" fill="#FFFFFF"/><text x="720" y="44" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#0F1C2E" text-anchor="middle">Figura DV-07.E8 — Máquina — Registro de ejecución real (T-06-32)</text><text x="720" y="66" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#6B7A90" text-anchor="middle">Permite captura incompleta sin convertirla en evidencia: solo lo confirmado es elegible para proyecciones.</text><line x1="40" y1="86" x2="1400" y2="86" stroke="#C9D3E0"/><path d="M228 330L405 330" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="317" y="318" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">CrearBorradorEjecucion</text><path d="M526 330L945 330" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><rect x="611" y="307" width="249" height="41" rx="4" fill="#FFFFFF" opacity=".95"/><text x="736" y="319" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">ConfirmarEjecucion</text><text x="736" y="332" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[referencia y contenido mínimo coherentes]</text><text x="736" y="345" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#1FA97A" text-anchor="middle">/ EjecucionRegistrada</text><path d="M444 308C430 264 510 264 496 305" stroke="#1F5FBF" stroke-width="1.7" fill="none" marker-end="url(#ab)"/><text x="470" y="268" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1F5FBF" text-anchor="middle">GuardarBorradorEjecucion</text><text x="470" y="281" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="500" fill="#6B7A90" text-anchor="middle">[registro todavía editable]</text><rect x="414" y="308" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.9"/><text x="470" y="335" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">BORRADOR</text><rect x="954" y="308" width="112" height="44" rx="12" fill="#FFFFFF" stroke="#0F1C2E" stroke-width="2.2"/><rect x="958" y="312" width="104" height="36" rx="9" fill="none" stroke="#0F1C2E" stroke-width="1"/><text x="1010" y="335" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#0F1C2E" text-anchor="middle">REGISTRADA</text><circle cx="220" cy="330" r="8" fill="#1FA97A"/><rect x="330" y="520" width="960" height="104" rx="9" fill="#FBF1DC" stroke="#C98F2C" stroke-width="1.3" stroke-dasharray="5 3"/><text x="350" y="544" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#C98F2C" text-anchor="start">Borrador ≠ evidencia</text><text x="350" y="564" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">El borrador no alimenta proyecciones ni contrasta con la prescripción.</text><text x="350" y="580" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Confirmar vuelve inmutable el original y lo hace elegible como evidencia.</text><text x="350" y="596" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6B7A90" text-anchor="start">Corregir después se hace con UC-I12 (corrección trazable), sin reabrir el registro.</text><rect x="40" y="686" width="660" height="64" rx="10" fill="#FBFCFE" stroke="#C9D3E0"/><line x1="60" y1="704" x2="96" y2="704" stroke="#1F5FBF" stroke-width="1.5"/><text x="60" y="699" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="start">1</text><text x="96" y="699" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#6B7A90" text-anchor="end">0..N</text><text x="108" y="708" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Transición declarada en la lista blanca</text><rect x="60" y="716" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="1.7"/><text x="108" y="729" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F1C2E" text-anchor="start">Estado del conjunto cerrado</text><text x="734" y="708" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Nombre de transición en azul · [guarda] en gris · / evento emitido en verde. Las guardas son la columna «condiciones» literal de la lista blanca.</text><text x="734" y="727" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Toda transición no declarada está prohibida.</text><text x="734" y="746" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start"></text><text x="734" y="765" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="500" fill="#6B7A90" text-anchor="start">Derivado de BE-LEG-06 v0.1.1 §11.9 · lista blanca literal · sin cambio semántico</text></svg>