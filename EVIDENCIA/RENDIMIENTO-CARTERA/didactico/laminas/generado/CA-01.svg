<text x="63" y="80.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">Abre el espacio</text>
<text x="63" y="93.37" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">profesional.</text>
<rect x="150" y="4" width="176" height="87.28" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="238" y="23.66" font-family="Inter" font-size="11" font-weight="600" fill="#0A1F44" text-anchor="middle">Website · Pendientes</text>
<text x="238" y="36.77" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">[espacio-profesional.tsx]</text>
<text x="238" y="53.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">Pide GET /me/portfolio de a 50 y</text>
<text x="238" y="66.37" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">hasta 4 páginas seguidas; «Ver</text>
<text x="238" y="79.17" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">más» pide otras 4.</text>
