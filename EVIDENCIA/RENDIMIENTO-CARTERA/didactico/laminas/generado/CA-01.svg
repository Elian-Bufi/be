<text x="442" y="23.66" font-family="Inter" font-size="11" font-weight="600" fill="#0A1F44" text-anchor="middle">CarteraController</text>
<text x="442" y="36.77" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">[API-CAR-01]</text>
<text x="442" y="53.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">SesionGuard autentica; valida la</text>
<text x="442" y="66.37" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">query (límite, cursor, filtros);</text>
<text x="442" y="79.17" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">límite por actor.</text>
