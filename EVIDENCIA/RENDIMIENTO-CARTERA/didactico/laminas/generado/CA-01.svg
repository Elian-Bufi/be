<text x="577" y="255.49" font-family="Inter" font-size="10" font-weight="400" fill="#566881">Una página: items (hasta 50),</text>
<text x="577" y="268.29" font-family="Inter" font-size="10" font-weight="400" fill="#566881">partialView, today y page</text>
<text x="577" y="281.09" font-family="Inter" font-size="10" font-weight="400" fill="#566881">(nextCursor, hasMore). La página</text>
<text x="577" y="293.89" font-family="Inter" font-size="10" font-weight="400" fill="#566881">siguiente repite los cuatro pasos.</text>
