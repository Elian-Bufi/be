<text x="652" y="23.66" font-family="Inter" font-size="11" font-weight="600" fill="#0A1F44" text-anchor="middle">leerCartera</text>
<text x="652" y="36.77" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">[lectura-cartera.ts]</text>
<text x="652" y="53.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">Los cuatro pasos de abajo, en este</text>
<text x="652" y="66.37" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">orden, en cada página.</text>
<rect x="4" y="116" width="176" height="84" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="92" y="141.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">1 · Los vínculos</text>
<text x="92" y="156.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Una consulta: los alcances</text>
<text x="92" y="169.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">ACEPTADO del profesional,</text>
<text x="92" y="181.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">hasta 200 personas.</text>
<rect x="192" y="116" width="176" height="84" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="280" y="134.85" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">2 · El PDP, por persona</text>
<text x="280" y="149.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">decidirPorAlcance: bloqueo</text>
<text x="280" y="162.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">compartido, hechos, 3 filas de</text>
<text x="280" y="175.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">decisión, COMMIT. Con 200</text>
<text x="280" y="188.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">personas, 200 veces.</text>
<rect x="380" y="116" width="176" height="84" rx="10" fill="#DCE8FC" stroke="#0A1F44" stroke-width="2"/>
<text x="468" y="134.85" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">3 · Los hechos</text>
<text x="468" y="149.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Una transacción de lectura: plan,</text>
<text x="468" y="162.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">borrador, Proceso, revisión,</text>
<text x="468" y="175.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">solicitud, actividad. Acá cambia</text>
<text x="468" y="188.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">la propuesta.</text>
<rect x="568" y="116" width="176" height="84" rx="10" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="656" y="141.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">4 · Orden y página</text>
<text x="656" y="156.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">ordenarPendientes (dominio), la</text>
<text x="656" y="169.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">página pedida y el cursor del</text>
<text x="656" y="181.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">último ítem. En memoria.</text>
