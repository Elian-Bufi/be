<text x="558" y="90.77" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">Una ida y vuelta</text>
<text x="558" y="103.57" font-family="Inter" font-size="10" font-weight="400" fill="#0A1F44" text-anchor="middle">por consulta.</text>
<rect x="502" y="150" width="232" height="72" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="618" y="169.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Armar los hechos de cada par</text>
<text x="618" y="184.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">En memoria, en el mismo orden de siempre:</text>
<text x="618" y="197.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">revisión, borrador o sin plan, solicitud.</text>
<text x="618" y="209.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Mapas por (alcance, persona).</text>
<rect x="502" y="238" width="232" height="64" rx="6" fill="#E7F9FD" stroke="#0E7490" stroke-width="1.2"/>
<text x="618" y="253.25" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">La misma lista</text>
<text x="618" y="268.21" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Mismos ítems, mismo orden, mismo cursor.</text>
<text x="618" y="281.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Lo comprueba la prueba de equivalencia</text>
<text x="618" y="293.81" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">contra la copia congelada.</text>
