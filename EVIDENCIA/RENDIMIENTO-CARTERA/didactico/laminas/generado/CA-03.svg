<text x="347" y="107.05" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Procesos abiertos</text>
<text x="347" y="122.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">y sus expectativas vigentes (otra sentencia)</text>
<rect x="232" y="144" width="230" height="46" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="347" y="163.05" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Solicitudes sin respuesta</text>
<text x="347" y="178.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">la más antigua por par y alcance</text>
<rect x="232" y="200" width="230" height="46" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="347" y="219.05" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Evaluaciones en preparación</text>
<text x="347" y="234.01" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">la más antigua por par</text>
<rect x="232" y="256" width="230" height="46" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="347" y="268.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Actividad del período</text>
