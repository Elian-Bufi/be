<text x="104" y="88.13" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Nutrición: Ana, Bruno, … ·</text>
<text x="104" y="100.93" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Entrenamiento: Ana, … ·</text>
<text x="104" y="113.73" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">Antropometría: Carla, … Cada</text>
<text x="104" y="126.53" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">consulta recibe solo la lista de su</text>
<text x="104" y="139.33" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">alcance.</text>
<rect x="232" y="32" width="230" height="46" rx="6" fill="#EEF4FE" stroke="#1453C9" stroke-width="1.2"/>
<text x="347" y="44.65" font-family="Inter" font-size="10.5" font-weight="600" fill="#0A1F44" text-anchor="middle">Borradores pendientes</text>
<text x="347" y="59.61" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">una por alcance de plan; DISTINCT ON: una</text>
<text x="347" y="72.41" font-family="Inter" font-size="10" font-weight="500" fill="#566881" text-anchor="middle">fila por par</text>
