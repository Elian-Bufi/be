<text x="13" y="238.69" font-family="Inter" font-size="10" font-weight="600" fill="#0A1F44">Un corte en el medio (revocar, pausar, suspender)</text>
<text x="13" y="251.49" font-family="Inter" font-size="10" font-weight="400" fill="#566881">Toma en modo exclusivo las mismas filas que la decisión toma en modo</text>
<text x="13" y="264.29" font-family="Inter" font-size="10" font-weight="400" fill="#566881">compartido: espera a que termine la decisión en curso, y la decisión</text>
<text x="13" y="277.09" font-family="Inter" font-size="10" font-weight="400" fill="#566881">siguiente ya lo ve. Eso es el paso 2, que no cambia.</text>
<path d="M 384 222 L 737 222 L 746 231 L 746 287.2 L 384 287.2 Z" fill="#F7F9FC" stroke="#9AA8BC" stroke-width="1"/>
<path d="M 737 222 L 737 231 L 746 231" fill="none" stroke="#9AA8BC" stroke-width="1"/>
<text x="393" y="238.69" font-family="Inter" font-size="10" font-weight="600" fill="#0A1F44">La lectura nunca decide</text>
<text x="393" y="251.49" font-family="Inter" font-size="10" font-weight="400" fill="#566881">Lee solo los pares ya permitidos. Si un corte llega durante la lectura, esa</text>
<text x="393" y="264.29" font-family="Inter" font-size="10" font-weight="400" fill="#566881">página ya estaba decidida (antes y después); la próxima página vuelve a</text>
<text x="393" y="277.09" font-family="Inter" font-size="10" font-weight="400" fill="#566881">decidir. Lo único que cambia es que la lectura dura menos.</text>
