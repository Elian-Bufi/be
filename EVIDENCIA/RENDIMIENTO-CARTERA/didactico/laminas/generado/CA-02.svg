<text x="525" y="148.69" font-family="Inter" font-size="10" font-weight="600" fill="#0A1F44">Por qué se llama N+1</text>
<text x="525" y="161.49" font-family="Inter" font-size="10" font-weight="400" fill="#566881">Una consulta para la lista (los vínculos) y</text>
