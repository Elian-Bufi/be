<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Render en navegador con la API local · evidencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=block">
<style>
  html, body { margin: 0; padding: 0; background: #e9ecef; }
  body { padding: 10px 14px 14px; box-sizing: border-box; }
  .aviso { background: #b00020; color: #fff; font: 800 12px/1.35 Roboto, Arial, sans-serif; padding: 6px 9px; border-radius: 6px; }
  .titulo { font: 800 15px/1.3 Roboto, Arial, sans-serif; color: #1b1f24; margin: 7px 0 1px; }
  .nota { font: 400 12px/1.35 Roboto, Arial, sans-serif; color: #3d4248; margin-bottom: 8px; }
  #root { position: relative; width: var(--ancho); height: var(--alto); overflow: hidden; display: flex; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  #root * { font-family: Roboto, Arial, sans-serif !important; }
</style>
</head>
<body>
<div class="aviso">RENDER DE COMPONENTES EN NAVEGADOR (react-native-web) CONTRA LA API LOCAL REAL · NO ES LA APK NI UNA CAPTURA NATIVA · CUENTA SINTÉTICA</div>
<div class="titulo" id="titulo"></div>
<div class="nota" id="nota"></div>
<div id="root"></div>
<script>
  const p = new URLSearchParams(location.search);
  document.documentElement.style.setProperty('--ancho', (p.get('ancho') || '360') + 'px');
  document.documentElement.style.setProperty('--alto', (p.get('alto') || '780') + 'px');
  document.getElementById('titulo').textContent = p.get('titulo') || '';
  const NOMBRE = { 'azul-noche': 'Azul noche', claro: 'Claro' };
  const escala = (p.get('escala') || '1').replace('.', ',');
  document.getElementById('nota').textContent = `${NOMBRE[p.get('tema')] || p.get('tema')} · ${p.get('ancho')} dp · letra ×${escala}${p.get('final') === '1' ? ' · desplazada hasta el final' : ''}${p.get('nota') ? ' · ' + p.get('nota') : ''}`;
</script>
<script src="maqueta-real.js"></script>
</body>
</html>
