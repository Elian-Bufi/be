# Capturas de WP-TABLERO-ALTA-GAMA (TB-00 y la recaptura de cada parte, §8.1 del paquete): la cohorte sintética en un
# PostgreSQL efímero, la API y el website compilados, y las capturas en Claro y Azul noche, a 1280 × 800, a 1440 × 900
# y a 1920 × 950, con las peticiones a la API de cada página (TEST-TAG-032). Esta PC no levanta los tres juntos: lo
# hace la CI.
# No es un check de la integración: no bloquea nada y no despliega nada. Corre en las ramas del paquete cuando cambia el
# website o el dominio, y a pedido.
name: capturas-del-tablero

on:
  push:
    branches: ["wp-tablero-*"]
    paths:
      - "apps/web/**"
      - "packages/domain/src/**"
      - "EVIDENCIA/TABLERO-ALTA-GAMA/herramientas/**"
      - ".github/workflows/capturas-del-tablero.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturas-del-tablero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: capturas · cohorte sintética (website + API + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: be_test
          POSTGRES_PASSWORD: be_test
          POSTGRES_DB: be_test_cohorte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U be_test -d be_test_cohorte"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build de la API
        run: npm run build:api
      - name: Build del website contra la API local
        run: npm run build:web
        env:
          BE_API_BASE_URL: http://localhost:3001
      - name: La cohorte y las capturas
        run: node EVIDENCIA/TABLERO-ALTA-GAMA/herramientas/capturas.mjs capturas-del-tablero
        env:
          BE_E2E_DATABASE_URL: postgresql://be_test:be_test@localhost:5432/be_test_cohorte
          CHROME: /usr/bin/google-chrome
          TZ: America/Argentina/Buenos_Aires
      - name: Capturas, mediciones y registro de la API (datos sintéticos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-del-tablero
          path: capturas-del-tablero
          if-no-files-found: warn
          retention-days: 90
