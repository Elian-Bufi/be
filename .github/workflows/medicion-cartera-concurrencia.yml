# Medición de la cartera (API-CAR-01) con historia, concurrencia y desglose del tiempo (encargo nocturno del
# 2026-10-28, §13). Solo vive en la rama descartable medicion/cartera-concurrencia-2026-10-28: NO SE INTEGRA.
# Primero el humo (el arnés entero en miniatura, en otra máquina); si pasa, la medición: el arnés anterior sin cambios
# como control y después el nuevo, los dos en la misma máquina. Ver EVIDENCIA/RENDIMIENTO-CARTERA/LEEME.md.
# No toca test ni Render: PostgreSQL 16 nace vacío en el runner y solo recibe datos sintéticos.
name: medición de la cartera con concurrencia
on:
  push:
    branches: ["medicion/cartera-concurrencia-*"]
permissions:
  contents: read
concurrency:
  group: medicion-cartera-concurrencia
  cancel-in-progress: false
env:
  # Credenciales sintéticas de un PostgreSQL efímero del runner (las mismas que usa ci.yml).
  BE_PG_URL: postgresql://be_test:be_test_sintetico@localhost:55432/be_test

jobs:
  humo:
    name: humo · el arnés entero en miniatura
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:domain
      - name: PostgreSQL 16 con pg_stat_statements precargado
        run: |
          docker run -d --name be-pg -p 55432:5432 \
            -e POSTGRES_USER=be_test -e POSTGRES_PASSWORD=be_test_sintetico -e POSTGRES_DB=be_test \
            postgres:16-alpine -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.max=10000
          for i in $(seq 1 60); do docker exec be-pg pg_isready -U be_test -d be_test && break; sleep 1; done
          echo "BE_CLK_TCK=$(getconf CLK_TCK)" >> "$GITHUB_ENV"
      - name: Humo
        env:
          BE_MEDIR_CONCURRENCIA: "1"
          BE_CONCURRENCIA_PERFIL: humo
          TEST_DATABASE_URL: ${{ env.BE_PG_URL }}
          BE_CONCURRENCIA_SALIDA: ${{ github.workspace }}/resultados/humo
        run: npx jest --config test/rendimiento/jest.rendimiento.config.js --runInBand --forceExit 'test/rendimiento/cartera-concurrencia\.rendimiento\.ts$'
      - name: Análisis del humo
        if: always()
        run: node test/rendimiento/analizar-concurrencia.mjs resultados/humo EVIDENCIA/RENDIMIENTO-CARTERA/resultados/cartera-2026-10-28-06-04-41.json
      - name: Registro de PostgreSQL
        if: always()
        run: docker logs be-pg 2>&1 | tail -n 300 > resultados/humo/postgres.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: humo
          path: resultados
          if-no-files-found: warn

  medir:
    name: medición · historia, concurrencia y desglose
    needs: humo
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:domain
      - name: La máquina
        run: |
          mkdir -p resultados
          {
            echo "## nproc"; nproc
            echo "## lscpu"; lscpu
            echo "## free -m"; free -m
            echo "## node"; node --version
            echo "## docker"; docker --version
            echo "## uname"; uname -a
            echo "## CLK_TCK"; getconf CLK_TCK
            echo "## disco"; df -h .
          } | tee resultados/maquina.txt
          echo "BE_CLK_TCK=$(getconf CLK_TCK)" >> "$GITHUB_ENV"
      - name: Control · el arnés anterior sin cambios, en esta máquina (Testcontainers, como la corrida 40641148313)
        env:
          BE_MEDIR_RENDIMIENTO: "1"
          BE_RENDIMIENTO_SALIDA: ${{ github.workspace }}/resultados/control
        run: npx jest --config test/rendimiento/jest.rendimiento.config.js --runInBand 'test/rendimiento/cartera\.rendimiento\.ts$'
      - name: PostgreSQL 16 con pg_stat_statements precargado (la misma imagen; las estadísticas las prende y apaga el arnés)
        run: |
          docker run -d --name be-pg -p 55432:5432 \
            -e POSTGRES_USER=be_test -e POSTGRES_PASSWORD=be_test_sintetico -e POSTGRES_DB=be_test \
            postgres:16-alpine -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.max=10000
          for i in $(seq 1 60); do docker exec be-pg pg_isready -U be_test -d be_test && break; sleep 1; done
          echo "BE_IMAGEN_PG=$(docker inspect --format '{{index .RepoDigests 0}}' postgres:16-alpine)" >> "$GITHUB_ENV"
      - name: Medir
        env:
          BE_MEDIR_CONCURRENCIA: "1"
          TEST_DATABASE_URL: ${{ env.BE_PG_URL }}
          BE_CONCURRENCIA_SALIDA: ${{ github.workspace }}/resultados/concurrencia
        run: npx jest --config test/rendimiento/jest.rendimiento.config.js --runInBand --forceExit 'test/rendimiento/cartera-concurrencia\.rendimiento\.ts$'
      - name: Analizar
        if: always()
        run: node test/rendimiento/analizar-concurrencia.mjs resultados/concurrencia EVIDENCIA/RENDIMIENTO-CARTERA/resultados/cartera-2026-10-28-06-04-41.json resultados/control
      - name: Registro de PostgreSQL
        if: always()
        run: docker logs be-pg 2>&1 | tail -n 300 > resultados/concurrencia/postgres.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-cartera-concurrencia
          path: resultados
          if-no-files-found: warn
