# Capturas de la planificación, las dos áreas en dos trabajos paralelos, cada uno con su PostgreSQL efímero (las dos
# herramientas levantan la API en :3001 y el website en :3000 y cargan su cohorte en la misma base):
# - Entrenamiento (WP-ENTRENAMIENTO-PLANIFICACION, DL-181, y WP-PLANTILLAS-DE-ENTRENAMIENTO, DL-182): el editor del plan
#   con los bloques de la sesión, la revisión honesta, el menú de la fase, el criterio arriba de las series, el preset con
#   la sesión vacía y las plantillas; a 1280 × 800, 1536 × 730 y 1920 × 950.
# - Nutrición (NUP-15, WP-NUTRICION-PLANIFICACION; WP-NUTRICION-ALIMENTOS, DL-180, y su segundo tramo): el editor del plan
#   con los números donde se planifica, los alimentos del catálogo, la imagen de la receta, la consola, lo propio, el canon
#   y las medidas caseras; a 1280 × 800, 1536 × 760 (Windows al 125 %) y 1920 × 950.
# La cohorte sintética, la API y el website compilados, y las capturas en Claro y Azul noche. Esta PC no levanta los tres
# juntos: lo hace la CI.
# No es un check de la integración: no bloquea nada y no despliega nada. Corre en las ramas de los paquetes (y en la de la
# integración) cuando cambian las herramientas, este archivo o las pantallas que captura, y a pedido.
name: capturas-de-la-planificacion

on:
  push:
    branches:
      - "wp-entrenamiento-planificacion"
      - "wp-plantillas-de-entrenamiento"
      - "wp-nutricion-planificacion"
      - "wp-nutricion-alimentos"
      - "wp-nutricion-alimentos-2"
      - "integracion-planificacion"
    paths:
      - ".github/workflows/capturas-de-la-planificacion.yml"
      - "EVIDENCIA/ENTRENAMIENTO-PLANIFICACION/herramientas/**"
      - "EVIDENCIA/NUTRICION-PLANIFICACION/herramientas/**"
      - "apps/web/src/app/pro/advisees/training/**"
      # WP-PLANTILLAS-DE-ENTRENAMIENTO (DL-182): la colección, el detalle y el editor de una plantilla.
      - "apps/web/src/app/pro/templates/**"
      - "apps/web/src/app/pro/advisees/nutrition/**"
      - "apps/web/src/app/pro/foods/**"
      - "apps/web/src/app/pro/recipes/**"
      - "apps/web/src/app/admin/foods/**"
      - "apps/web/src/components/**"
      - "apps/web/src/app/globals.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturas-de-la-planificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: capturas · planificación de ${{ matrix.area.nombre }} (website + API + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        area:
          - nombre: Entrenamiento
            herramienta: EVIDENCIA/ENTRENAMIENTO-PLANIFICACION/herramientas/capturas.mjs
            salida: capturas-de-la-planificacion-entrenamiento
          - nombre: Nutrición
            herramienta: EVIDENCIA/NUTRICION-PLANIFICACION/herramientas/capturas.mjs
            salida: capturas-de-la-planificacion-nutricion
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: be_test
          POSTGRES_PASSWORD: be_test
          POSTGRES_DB: be_test_cohorte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U be_test -d be_test_cohorte"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build de la API
        run: npm run build:api
      - name: Build del website contra la API local
        run: npm run build:web
        env:
          BE_API_BASE_URL: http://localhost:3001
      - name: La cohorte y las capturas
        run: node ${{ matrix.area.herramienta }} ${{ matrix.area.salida }}
        env:
          BE_E2E_DATABASE_URL: postgresql://be_test:be_test@localhost:5432/be_test_cohorte
          BE_COHORTE_CON_LA_ESTIMACION: si
          CHROME: /usr/bin/google-chrome
          TZ: America/Argentina/Buenos_Aires
      - name: Capturas y registro de la API (datos sintéticos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.area.salida }}
          path: ${{ matrix.area.salida }}
          if-no-files-found: warn
          retention-days: 30
