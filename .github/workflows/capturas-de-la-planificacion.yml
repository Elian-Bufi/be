# NUP-15 (WP-NUTRICION-PLANIFICACION): las capturas del editor del plan de Nutrición con los números donde se planifica.
# WP-NUTRICION-ALIMENTOS (DL-180) suma las de los alimentos del catálogo, la imagen de la receta y la consola.
# La cohorte sintética en un PostgreSQL efímero, la API y el website compilados, y las capturas en Claro y Azul noche, a
# 1280 × 800, a 1536 × 760 (Windows al 125 %) y a 1920 × 950. Esta PC no levanta los tres juntos: lo hace la CI.
# No es un check de la integración: no bloquea nada y no despliega nada. Corre en la rama del paquete cuando cambian la
# herramienta, este archivo o las pantallas que captura, y a pedido.
name: capturas-de-la-planificacion

on:
  push:
    branches: ["wp-nutricion-planificacion", "wp-nutricion-alimentos"]
    paths:
      - "EVIDENCIA/NUTRICION-PLANIFICACION/herramientas/**"
      - ".github/workflows/capturas-de-la-planificacion.yml"
      - "apps/web/src/app/pro/advisees/nutrition/**"
      - "apps/web/src/app/pro/foods/**"
      - "apps/web/src/app/pro/recipes/**"
      - "apps/web/src/app/admin/foods/**"
      - "apps/web/src/components/**"
      - "apps/web/src/app/globals.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturas-de-la-planificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: capturas · planificación de Nutrición (website + API + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: be_test
          POSTGRES_PASSWORD: be_test
          POSTGRES_DB: be_test_cohorte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U be_test -d be_test_cohorte"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build de la API
        run: npm run build:api
      - name: Build del website contra la API local
        run: npm run build:web
        env:
          BE_API_BASE_URL: http://localhost:3001
      - name: La cohorte y las capturas
        run: node EVIDENCIA/NUTRICION-PLANIFICACION/herramientas/capturas.mjs capturas-de-la-planificacion
        env:
          BE_E2E_DATABASE_URL: postgresql://be_test:be_test@localhost:5432/be_test_cohorte
          BE_COHORTE_CON_LA_ESTIMACION: si
          CHROME: /usr/bin/google-chrome
          TZ: America/Argentina/Buenos_Aires
      - name: Capturas y registro de la API (datos sintéticos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-la-planificacion
          path: capturas-de-la-planificacion
          if-no-files-found: warn
          retention-days: 30
