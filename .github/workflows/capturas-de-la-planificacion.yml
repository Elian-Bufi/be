# Capturas de WP-ENTRENAMIENTO-PLANIFICACION (DL-181): el editor del plan de Entrenamiento con los bloques de la sesión, la
# revisión honesta, el menú de la fase, el criterio arriba de las series y el preset con la sesión vacía, con la cohorte
# sintética en un PostgreSQL efímero, la API y el website compilados, en Claro y Azul noche, a 1280 × 800, 1536 × 730 y
# 1920 × 950. Esta PC no levanta los tres juntos: lo hace la CI.
# No es un check de la integración: no bloquea nada y no despliega nada. Corre en la rama del paquete cuando cambia la
# herramienta, este archivo o el editor de Entrenamiento, y a pedido.
name: capturas-de-la-planificacion

on:
  push:
    branches: ["wp-entrenamiento-planificacion", "wp-plantillas-de-entrenamiento"]
    paths:
      - "EVIDENCIA/ENTRENAMIENTO-PLANIFICACION/herramientas/**"
      - ".github/workflows/capturas-de-la-planificacion.yml"
      - "apps/web/src/app/pro/advisees/training/**"
      # WP-PLANTILLAS-DE-ENTRENAMIENTO (DL-182): la colección, el detalle y el editor de una plantilla.
      - "apps/web/src/app/pro/templates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capturas-de-la-planificacion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: capturas · planificación de Entrenamiento (website + API + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: be_test
          POSTGRES_PASSWORD: be_test
          POSTGRES_DB: be_test_cohorte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U be_test -d be_test_cohorte"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Build de la API
        run: npm run build:api
      - name: Build del website contra la API local
        run: npm run build:web
        env:
          BE_API_BASE_URL: http://localhost:3001
      - name: La cohorte y las capturas
        run: node EVIDENCIA/ENTRENAMIENTO-PLANIFICACION/herramientas/capturas.mjs capturas-de-la-planificacion
        env:
          BE_E2E_DATABASE_URL: postgresql://be_test:be_test@localhost:5432/be_test_cohorte
          BE_COHORTE_CON_LA_ESTIMACION: si
          CHROME: /usr/bin/google-chrome
          TZ: America/Argentina/Buenos_Aires
      - name: Capturas y registro de la API (datos sintéticos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-la-planificacion
          path: capturas-de-la-planificacion
          if-no-files-found: warn
          retention-days: 30
