# CI — verifica cada push y PR (07 §35).
# Render despliega `test` solo cuando TODOS estos checks pasan en main (autoDeployTrigger: checksPass, 07 §36).
name: ci

on:
  push:
    branches: [main, "wp-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legajo:
    name: legajo · hashes SHA-256
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verificar docs/MANIFEST.sha256 (salvo lo no publicado por Dirección)
        run: bash scripts/verificar-legajo.sh

  verificar:
    name: verificar · typecheck · unit · build · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Typecheck (domain, api, web, mobile)
        run: npm run typecheck
      - name: OpenAPI generado desde @be/domain sin drift (09v7 T21)
        run: node scripts/generar-openapi.cjs --verificar
      - name: Pruebas unitarias (domain, api)
        run: npm test
      - name: Build API
        run: npm run build:api
      - name: Build web (export estático)
        run: npm run build:web
      - name: npm audit --omit=dev — falla con altos o críticos (WP-01 §2)
        run: npm run audit:prod

  integracion:
    name: integración · PostgreSQL 16 (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Schema vs 06 · identidad y sesiones (TEST-AUTH-*) · readiness · migración fallida aborta
        run: npm run build:domain && npm run test:integration -w @be/api -- --verbose --json --outputFile=${{ github.workspace }}/resultados-integracion.json
      - name: Resultados por ID de prueba (evidencia)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-integracion
          path: resultados-integracion.json
          if-no-files-found: error

  imagen-api:
    name: imagen API · migrate deploy + readiness (ASR-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build de la imagen OCI
        run: docker build -f apps/api/Dockerfile --build-arg RENDER_GIT_COMMIT=${{ github.sha }} -t be-api:${{ github.sha }} .
      - name: PostgreSQL 16 efímero
        run: |
          docker network create be
          docker run -d --name pg --network be \
            -e POSTGRES_USER=be_test -e POSTGRES_PASSWORD=be_test_sintetico -e POSTGRES_DB=be_test \
            postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U be_test -d be_test && break; sleep 2; done
      - name: Arranque del artefacto (migraciones como fase del deploy)
        run: |
          # Secreto efímero generado en el runner: nunca en el repositorio ni en el log (08 §32).
          docker run -d --name api --network be -p 3000:3000 \
            -e APP_ENV=test \
            -e DATABASE_URL=postgresql://be_test:be_test_sintetico@pg:5432/be_test \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            be-api:${{ github.sha }}
      - name: Smoke — /health/ready 200 con el SHA esperado (07 §37)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health/ready -o ready.json; then break; fi
            sleep 2
          done
          docker logs api
          cat ready.json
          test "$(jq -r .data.estado ready.json)" = "OK"
          test "$(jq -r .data.dependencias.migraciones ready.json)" = "OK"
          test "$(jq -r .data.version.commit ready.json)" = "${{ github.sha }}"
          curl -fsS http://localhost:3000/health/live
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/no-existe)" = "404"
      - name: Smoke e2e del artefacto — registro A1+A2 → login → /me → A3 no otorgado → logout (WP-02)
        run: |
          B=http://localhost:3000/api/v1
          CORREO="persona-ci-${{ github.run_id }}@example.invalid"
          jq -n --arg c "$CORREO" '{registrationIntent:"ADVISEE",identity:{localIdentifier:$c,localCredential:"clave-sintetica-de-ci-01"},termsAcceptance:{versionId:"terminos-2026-09-demo"},privacyAcknowledgement:{versionId:"privacidad-2026-09-demo"}}' > alta.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -H "Idempotency-Key: ci-${{ github.run_id }}" -d @alta.json $B/registrations)" = "201"
          jq -n --arg c "$CORREO" '{method:"LOCAL",identifier:$c,credential:"clave-sintetica-de-ci-01"}' > login.json
          TOKEN=$(curl -fsS -H 'Content-Type: application/json' -d @login.json $B/auth/sessions | jq -r .data.session.accessToken)
          echo "::add-mask::$TOKEN"
          test "$(curl -fsS -H "Authorization: Bearer $TOKEN" $B/me | jq -r .data.accountOperationalState)" = "OPERATIVA"
          test "$(curl -fsS -H "Authorization: Bearer $TOKEN" $B/me/health-data-consent-requirement | jq -c .data.currentConsent)" = "null"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" $B/auth/sessions/current)" = "204"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" $B/me)" = "401"
          # El log del contenedor no contiene la credencial ni el correo.
          ! docker logs api 2>&1 | grep -q -e "clave-sintetica-de-ci-01" -e "$CORREO"
